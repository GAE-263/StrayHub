server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    # Certbot's host-level HTTP-01 webroot is the only plaintext route.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/strayhub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strayhub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StrayHubTLS:10m;
    ssl_session_timeout 1d;

    # Keep the B2 upload ceiling identical after TLS termination.
    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        proxy_pass http://api:8080;
    }

    # No URI suffix: FastAPI receives the complete /v1 path unchanged.
    location = /v1 {
        proxy_pass http://api:8080;
    }

    location ^~ /v1/ {
        proxy_pass http://api:8080;
    }

    # Includes /, /_next/*, /login, /volunteer-application, and predictable Next.js 404s.
    location / {
        proxy_pass http://web:8080;
    }
}
