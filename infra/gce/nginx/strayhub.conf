server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Matches the existing browser-facing Next.js proxy limit. Revisit when a canonical media
    # upload contract exists; unlimited request bodies are intentionally not allowed.
    client_max_body_size 1m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://api:8080;
    }

    # No URI suffix: FastAPI receives the complete /v1 path unchanged.
    location = /v1 {
        proxy_pass http://api:8080;
    }

    location ^~ /v1/ {
        proxy_pass http://api:8080;
    }

    # Includes /, /_next/*, /login, /volunteer-application, and predictable Next.js 404s.
    location / {
        proxy_pass http://web:8080;
    }
}
