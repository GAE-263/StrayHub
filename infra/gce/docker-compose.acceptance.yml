name: strayhub-acceptance

# Layer after docker-compose.production.yml. Every host-facing or persistent
# boundary is replaced with an acceptance-only equivalent.
services:
  postgres:
    restart: "no"
    cpus: "0.50"
    mem_limit: 384m
    volumes: !override
      - acceptance_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro

  minio:
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    volumes: !override
      - acceptance_minio_data:/data

  minio-bootstrap:
    restart: "no"
    cpus: "0.10"
    mem_limit: 96m

  redis:
    restart: "no"
    cpus: "0.25"
    mem_limit: 192m
    volumes: !override
      - acceptance_redis_data:/data

  api:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?LINE_LOGIN_CHANNEL_ID is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"
    ports: !override
      - target: 8080
        published: ${ACCEPTANCE_API_HOST_PORT:?ACCEPTANCE_API_HOST_PORT is required}
        host_ip: ${ACCEPTANCE_BIND_HOST:?ACCEPTANCE_BIND_HOST is required}
        protocol: tcp

  migration:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}

  worker:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"

  celery-worker:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 640m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"
    command: !override
      - celery
      - -A
      - services.api.app.infrastructure.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required},${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      - --concurrency=1

  celery-beat:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"

  web:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 384m
    ports: !override
      - target: 8080
        published: ${ACCEPTANCE_WEB_HOST_PORT:?ACCEPTANCE_WEB_HOST_PORT is required}
        host_ip: ${ACCEPTANCE_BIND_HOST:?ACCEPTANCE_BIND_HOST is required}
        protocol: tcp

networks:
  strayhub_runtime:
    name: strayhub-acceptance-runtime
    driver: bridge

volumes:
  postgres_data: !reset null
  minio_data: !reset null
  redis_data: !reset null
  acceptance_postgres_data:
    name: strayhub-acceptance-postgres-data
  acceptance_minio_data:
    name: strayhub-acceptance-minio-data
  acceptance_redis_data:
    name: strayhub-acceptance-redis-data
