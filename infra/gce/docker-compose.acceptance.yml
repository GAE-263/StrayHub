name: strayhub-acceptance

# Layer after docker-compose.production.yml. Every host-facing or persistent
# boundary is replaced with an acceptance-only equivalent.
x-acceptance-runtime-safety-environment: &acceptance-runtime-safety-environment
  APP_ENV: acceptance
  LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:?LINE_CHANNEL_ID is required}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?LINE_CHANNEL_SECRET is required}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?LINE_CHANNEL_ACCESS_TOKEN is required}
  LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?LINE_LOGIN_CHANNEL_ID is required}
  LIFF_ID: ${LIFF_ID:?LIFF_ID is required}
  ANIMAL_CONFIRMATION_SECRET: ${ANIMAL_CONFIRMATION_SECRET:?ANIMAL_CONFIRMATION_SECRET is required}
  LOGIN_ABUSE_HMAC_SECRET: ${LOGIN_ABUSE_HMAC_SECRET:?LOGIN_ABUSE_HMAC_SECRET is required}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
  AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE is required}
  AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE is required}
  PII_ENCRYPTION_PROVIDER: ${PII_ENCRYPTION_PROVIDER:?PII_ENCRYPTION_PROVIDER is required}
  PII_KMS_KEY_NAME: ${PII_KMS_KEY_NAME:?PII_KMS_KEY_NAME is required}
  LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}

services:
  postgres:
    restart: "no"
    cpus: "0.50"
    mem_limit: 384m
    volumes: !override
      - acceptance_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro

  minio:
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    volumes: !override
      - acceptance_minio_data:/data

  minio-bootstrap:
    restart: "no"
    cpus: "0.10"
    mem_limit: 96m

  redis:
    restart: "no"
    cpus: "0.25"
    mem_limit: 192m
    volumes: !override
      - acceptance_redis_data:/data

  api:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:?LINE_LOGIN_CHANNEL_ID is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"
    ports: !override
      - target: 8080
        published: ${ACCEPTANCE_API_HOST_PORT:?ACCEPTANCE_API_HOST_PORT is required}
        host_ip: ${ACCEPTANCE_BIND_HOST:?ACCEPTANCE_BIND_HOST is required}
        protocol: tcp

  migration:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}

  worker:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    environment:
      APP_ENV: acceptance
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256: ${LINE_NOTIFICATION_RECIPIENT_ALLOWLIST_SHA256:?LINE notification allowlist is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"

  celery-worker:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 640m
    environment:
      <<: *acceptance-runtime-safety-environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"
    secrets: !override
      - source: runtime_jwt_private_key
        target: runtime_jwt_private_key
        mode: 0400
      - source: runtime_jwt_public_key
        target: runtime_jwt_public_key
        mode: 0444
    command: !override
      - /bin/sh
      - -ec
      - |
        export AUTH_JWT_ACTIVE_PRIVATE_KEY="$$(cat /run/secrets/runtime_jwt_private_key)"
        export AUTH_JWT_ACTIVE_PUBLIC_KEY="$$(cat /run/secrets/runtime_jwt_public_key)"
        exec celery -A services.api.app.infrastructure.celery_app:celery_app worker \
          --loglevel=INFO \
          --queues="$${CELERY_QUEUE_AI},$${CELERY_QUEUE_SYSTEM}" \
          --concurrency=1
    healthcheck:
      test: !override
        - CMD-SHELL
        - >-
          export AUTH_JWT_ACTIVE_PRIVATE_KEY="$$(cat /run/secrets/runtime_jwt_private_key)" &&
          export AUTH_JWT_ACTIVE_PUBLIC_KEY="$$(cat /run/secrets/runtime_jwt_public_key)" &&
          celery -A services.api.app.infrastructure.celery_app:celery_app inspect ping
          --destination "celery@$${HOSTNAME}" --timeout 5 | grep pong

  celery-beat:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.25"
    mem_limit: 256m
    environment:
      <<: *acceptance-runtime-safety-environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_AI_ENABLED: "false"
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:?CELERY_QUEUE_AI is required}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:?CELERY_QUEUE_SYSTEM is required}
      CELERY_WORKER_CONCURRENCY: "1"
    secrets: !override
      - source: runtime_jwt_private_key
        target: runtime_jwt_private_key
        mode: 0400
      - source: runtime_jwt_public_key
        target: runtime_jwt_public_key
        mode: 0444
    command: !override
      - /bin/sh
      - -ec
      - |
        export AUTH_JWT_ACTIVE_PRIVATE_KEY="$$(cat /run/secrets/runtime_jwt_private_key)"
        export AUTH_JWT_ACTIVE_PUBLIC_KEY="$$(cat /run/secrets/runtime_jwt_public_key)"
        exec celery -A services.api.app.infrastructure.celery_app:celery_app beat \
          --loglevel=INFO \
          --pidfile=/tmp/celerybeat.pid

  web:
    build: !reset null
    pull_policy: never
    restart: "no"
    cpus: "0.50"
    mem_limit: 384m
    ports: !override
      - target: 8080
        published: ${ACCEPTANCE_WEB_HOST_PORT:?ACCEPTANCE_WEB_HOST_PORT is required}
        host_ip: ${ACCEPTANCE_BIND_HOST:?ACCEPTANCE_BIND_HOST is required}
        protocol: tcp

networks:
  strayhub_runtime:
    name: strayhub-acceptance-runtime
    driver: bridge

volumes:
  postgres_data: !reset null
  minio_data: !reset null
  redis_data: !reset null
  acceptance_postgres_data:
    name: strayhub-acceptance-postgres-data
  acceptance_minio_data:
    name: strayhub-acceptance-minio-data
  acceptance_redis_data:
    name: strayhub-acceptance-redis-data
