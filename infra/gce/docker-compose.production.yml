name: strayhub-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set runtime http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "runtime/$${MINIO_BUCKET}"
        mc anonymous set none "runtime/$${MINIO_BUCKET}"
    networks:
      - strayhub_runtime

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:?REDIS_MAXMEMORY is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  api:
    image: ${STRAYHUB_API_IMAGE:-strayhub-api:b1}
    build:
      context: ../..
      dockerfile: infra/gce/images/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:?LINE_CHANNEL_ID is required}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?LINE_CHANNEL_SECRET is required}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?LINE_CHANNEL_ACCESS_TOKEN is required}
      LIFF_ID: ${LIFF_ID:?LIFF_ID is required}
      LINE_ROLE_MENU_FEATURES_ENABLED: ${LINE_ROLE_MENU_FEATURES_ENABLED:-false}
      LINE_STAFF_MENU_ENABLED: ${LINE_STAFF_MENU_ENABLED:-false}
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-}
      LINE_RICH_MENU_DEFAULT_ID: ${LINE_RICH_MENU_DEFAULT_ID:-}
      LINE_RICH_MENU_VOLUNTEER_ID: ${LINE_RICH_MENU_VOLUNTEER_ID:-}
      LINE_RICH_MENU_STAFF_ID: ${LINE_RICH_MENU_STAFF_ID:-}
      LINE_RICH_MENU_ADOPTION_HUB_ID: ${LINE_RICH_MENU_ADOPTION_HUB_ID:-}
      LINE_STAFF_LIFF_ID: ${LINE_STAFF_LIFF_ID:-}
      LINE_ROLE_MENU_SMOKE_EVIDENCE: ${LINE_ROLE_MENU_SMOKE_EVIDENCE:-}
      LINE_ROLE_MENU_TEST_ENABLED: ${LINE_ROLE_MENU_TEST_ENABLED:-false}
      LINE_ROLE_MENU_TEST_CHANNEL_ID: ${LINE_ROLE_MENU_TEST_CHANNEL_ID:-}
      LINE_ROLE_MENU_BOT_SHA256: ${LINE_ROLE_MENU_BOT_SHA256:-}
      LINE_ROLE_MENU_TEST_USER_SHA256: ${LINE_ROLE_MENU_TEST_USER_SHA256:-}
      LINE_ROLE_MENU_TEST_EXPIRES_AT: ${LINE_ROLE_MENU_TEST_EXPIRES_AT:-}
      LINE_ROLE_MENU_REPORT_FILE: /run/line-menu/report.json
      LINE_ROLE_MENU_REPORT_SHA256: ${LINE_ROLE_MENU_REPORT_SHA256:-}
      LINE_ROLE_MENU_RELEASE_FILE: /run/line-menu/release.json
      LINE_ROLE_MENU_RESOURCES_FILE: /run/line-menu/resources.json
      ANIMAL_CONFIRMATION_SECRET: ${ANIMAL_CONFIRMATION_SECRET:?ANIMAL_CONFIRMATION_SECRET is required}
      LOGIN_ABUSE_HMAC_SECRET: ${LOGIN_ABUSE_HMAC_SECRET:?LOGIN_ABUSE_HMAC_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE is required}
      AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE is required}
      PII_ENCRYPTION_PROVIDER: ${PII_ENCRYPTION_PROVIDER:?PII_ENCRYPTION_PROVIDER is required}
      PII_KMS_KEY_NAME: ${PII_KMS_KEY_NAME:?PII_KMS_KEY_NAME is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_AI_ENABLED: ${CELERY_AI_ENABLED:-false}
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:-ai}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:-system}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-45}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-60}
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-180}
      CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
      CELERY_RETRY_BACKOFF_MAX: ${CELERY_RETRY_BACKOFF_MAX:-120}
      CELERY_RECONCILE_INTERVAL_SECONDS: ${CELERY_RECONCILE_INTERVAL_SECONDS:-30}
    volumes:
      - type: bind
        source: ${LINE_ROLE_MENU_REPORT_PATH:-/dev/null}
        target: /run/line-menu/report.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LINE_ROLE_MENU_RELEASE_MANIFEST:-/dev/null}
        target: /run/line-menu/release.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LINE_ROLE_MENU_RESOURCES_PATH:-/dev/null}
        target: /run/line-menu/resources.json
        read_only: true
        bind:
          create_host_path: false
    secrets:
      # The selected env file supplies either ignored verification paths or protected D1 staged
      # production paths. No verification or production key path is hard-coded here.
      - source: runtime_jwt_private_key
        target: runtime_jwt_private_key
        mode: 0400
      - source: runtime_jwt_public_key
        target: runtime_jwt_public_key
        mode: 0444
    command:
      - /bin/sh
      - -ec
      - |
        export AUTH_JWT_ACTIVE_PRIVATE_KEY="$$(cat /run/secrets/runtime_jwt_private_key)"
        export AUTH_JWT_ACTIVE_PUBLIC_KEY="$$(cat /run/secrets/runtime_jwt_public_key)"
        exec uvicorn services.api.app.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - target: 8080
        published: ${E4_API_UPSTREAM_HOST_PORT:?E4_API_UPSTREAM_HOST_PORT is required}
        protocol: tcp
    networks:
      - strayhub_runtime

  migration:
    image: ${STRAYHUB_API_IMAGE:-strayhub-api:b1}
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
    command: ["alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    networks:
      - strayhub_runtime

  worker:
    image: ${STRAYHUB_WORKER_IMAGE:-strayhub-worker:b1}
    build:
      context: ../..
      dockerfile: infra/gce/images/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
      STOOL_API_URL: ${STOOL_API_URL:-}
      STOOL_API_KEY: ${STOOL_API_KEY:-}
      STOOL_TIMEOUT_SECONDS: ${STOOL_TIMEOUT_SECONDS:-30}
      LINE_ROLE_MENU_FEATURES_ENABLED: ${LINE_ROLE_MENU_FEATURES_ENABLED:-false}
      LINE_STAFF_MENU_ENABLED: ${LINE_STAFF_MENU_ENABLED:-false}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:?LINE_CHANNEL_ID is required}
      LINE_ROLE_MENU_TEST_ENABLED: ${LINE_ROLE_MENU_TEST_ENABLED:-false}
      LINE_ROLE_MENU_TEST_CHANNEL_ID: ${LINE_ROLE_MENU_TEST_CHANNEL_ID:-}
      LINE_ROLE_MENU_BOT_SHA256: ${LINE_ROLE_MENU_BOT_SHA256:-}
      LINE_ROLE_MENU_TEST_USER_SHA256: ${LINE_ROLE_MENU_TEST_USER_SHA256:-}
      LINE_ROLE_MENU_TEST_EXPIRES_AT: ${LINE_ROLE_MENU_TEST_EXPIRES_AT:-}
      LINE_RICH_MENU_DEFAULT_ID: ${LINE_RICH_MENU_DEFAULT_ID:-}
      LINE_RICH_MENU_VOLUNTEER_ID: ${LINE_RICH_MENU_VOLUNTEER_ID:-}
      LINE_RICH_MENU_STAFF_ID: ${LINE_RICH_MENU_STAFF_ID:-}
    networks:
      - strayhub_runtime

  celery-worker:
    image: ${STRAYHUB_WORKER_IMAGE:-strayhub-worker:b1}
    build:
      context: ../..
      dockerfile: infra/gce/images/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_AI_ENABLED: ${CELERY_AI_ENABLED:-false}
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:-ai}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:-system}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-45}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-60}
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-180}
      CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
      CELERY_RETRY_BACKOFF_MAX: ${CELERY_RETRY_BACKOFF_MAX:-120}
      CELERY_RECONCILE_INTERVAL_SECONDS: ${CELERY_RECONCILE_INTERVAL_SECONDS:-30}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_SERVICE_ACCOUNT_PATH: ${GEMINI_SERVICE_ACCOUNT_PATH:-}
      GEMINI_VERTEX_LOCATION: ${GEMINI_VERTEX_LOCATION:-global}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?LINE_CHANNEL_ACCESS_TOKEN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-}
      ANIMAL_CONFIRMATION_SECRET: ${ANIMAL_CONFIRMATION_SECRET:?ANIMAL_CONFIRMATION_SECRET is required}
    command:
      - celery
      - -A
      - services.api.app.infrastructure.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=${CELERY_QUEUE_AI:-ai},${CELERY_QUEUE_SYSTEM:-system}
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A services.api.app.infrastructure.celery_app:celery_app inspect ping --destination "celery@$${HOSTNAME}" --timeout 5 | grep pong
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - strayhub_runtime

  celery-beat:
    image: ${STRAYHUB_WORKER_IMAGE:-strayhub-worker:b1}
    build:
      context: ../..
      dockerfile: infra/gce/images/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_AI_ENABLED: ${CELERY_AI_ENABLED:-false}
      CELERY_QUEUE_AI: ${CELERY_QUEUE_AI:-ai}
      CELERY_QUEUE_SYSTEM: ${CELERY_QUEUE_SYSTEM:-system}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-45}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-60}
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-180}
      CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
      CELERY_RETRY_BACKOFF_MAX: ${CELERY_RETRY_BACKOFF_MAX:-120}
      CELERY_RECONCILE_INTERVAL_SECONDS: ${CELERY_RECONCILE_INTERVAL_SECONDS:-30}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-3.5-flash-lite}
      GEMINI_SERVICE_ACCOUNT_PATH: ${GEMINI_SERVICE_ACCOUNT_PATH:-}
      GEMINI_VERTEX_LOCATION: ${GEMINI_VERTEX_LOCATION:-global}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?LINE_CHANNEL_ACCESS_TOKEN is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
    command:
      - celery
      - -A
      - services.api.app.infrastructure.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --pidfile=/tmp/celerybeat.pid
    networks:
      - strayhub_runtime

  web:
    image: ${STRAYHUB_WEB_IMAGE:-strayhub-web:b1}
    build:
      context: ../..
      dockerfile: infra/gce/images/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
      LIFF_ID: ${LIFF_ID:?LIFF_ID is required}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - target: 8080
        published: ${E4_WEB_UPSTREAM_HOST_PORT:?E4_WEB_UPSTREAM_HOST_PORT is required}
        protocol: tcp
    networks:
      - strayhub_runtime

networks:
  strayhub_runtime:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:

secrets:
  runtime_jwt_private_key:
    file: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_FILE:?AUTH_JWT_ACTIVE_PRIVATE_KEY_FILE is required}
  runtime_jwt_public_key:
    file: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_FILE:?AUTH_JWT_ACTIVE_PUBLIC_KEY_FILE is required}
