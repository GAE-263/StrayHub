name: strayhub-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set runtime http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "runtime/$${MINIO_BUCKET}"
        mc anonymous set none "runtime/$${MINIO_BUCKET}"
    networks:
      - strayhub_runtime

  api:
    image: strayhub-api:b1
    build:
      context: ../..
      dockerfile: infra/gcp-demo/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:?LINE_CHANNEL_ID is required}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:?LINE_CHANNEL_SECRET is required}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:?LINE_CHANNEL_ACCESS_TOKEN is required}
      LIFF_ID: ${LIFF_ID:?LIFF_ID is required}
      ANIMAL_CONFIRMATION_SECRET: ${ANIMAL_CONFIRMATION_SECRET:?ANIMAL_CONFIRMATION_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PRIVATE_KEY_REFERENCE is required}
      AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE:?AUTH_JWT_ACTIVE_PUBLIC_KEY_REFERENCE is required}
      PII_ENCRYPTION_PROVIDER: ${PII_ENCRYPTION_PROVIDER:?PII_ENCRYPTION_PROVIDER is required}
      PII_KMS_KEY_NAME: ${PII_KMS_KEY_NAME:?PII_KMS_KEY_NAME is required}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-}
      AI_API_KEY: ${AI_API_KEY:-}
    secrets:
      # The selected env file supplies either ignored verification paths or protected D1 staged
      # production paths. No verification or production key path is hard-coded here.
      - source: runtime_jwt_private_key
        target: runtime_jwt_private_key
        mode: 0400
      - source: runtime_jwt_public_key
        target: runtime_jwt_public_key
        mode: 0444
    command:
      - /bin/sh
      - -ec
      - |
        export AUTH_JWT_ACTIVE_PRIVATE_KEY="$$(cat /run/secrets/runtime_jwt_private_key)"
        export AUTH_JWT_ACTIVE_PUBLIC_KEY="$$(cat /run/secrets/runtime_jwt_public_key)"
        exec uvicorn services.api.app.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  migration:
    image: strayhub-api:b1
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
    command: ["alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    networks:
      - strayhub_runtime

  worker:
    image: strayhub-worker:b1
    build:
      context: ../..
      dockerfile: infra/gcp-demo/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - strayhub_runtime

  web:
    image: strayhub-web:b1
    build:
      context: ../..
      dockerfile: infra/gcp-demo/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
      LIFF_ID: ${LIFF_ID:?LIFF_ID is required}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - target: 80
        published: ${B4_HTTP_HOST_PORT:-8088}
        protocol: tcp
      - target: 443
        published: ${B4_HTTPS_HOST_PORT:-8443}
        protocol: tcp
    volumes:
      - ./nginx/strayhub.conf:/etc/nginx/conf.d/default.conf:ro
      - ${B4_LETSENCRYPT_DIR:?B4_LETSENCRYPT_DIR is required}:/etc/letsencrypt:ro
      - ${B4_ACME_WEBROOT:?B4_ACME_WEBROOT is required}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --spider https://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - strayhub_runtime

networks:
  strayhub_runtime:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

secrets:
  runtime_jwt_private_key:
    file: ${AUTH_JWT_ACTIVE_PRIVATE_KEY_FILE:?AUTH_JWT_ACTIVE_PRIVATE_KEY_FILE is required}
  runtime_jwt_public_key:
    file: ${AUTH_JWT_ACTIVE_PUBLIC_KEY_FILE:?AUTH_JWT_ACTIVE_PUBLIC_KEY_FILE is required}
