services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: strayhub
      POSTGRES_USER: strayhub
      POSTGRES_PASSWORD: strayhub
    ports:
      - "65432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strayhub -d strayhub"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    # Community-maintained fork (pgsty/Silo, RELEASE.2026-08-04T00-00-00Z), pinned to the multi-arch
    # index so amd64 and arm64 dev machines both work. Matches infra/gce production.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-access-key
      MINIO_ROOT_PASSWORD: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  redis-data:
