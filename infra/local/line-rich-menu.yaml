    type: postback
    data: action=start_care_report
  - label: 掃描 QR Code
    type: uri
    uri: ${LIFF_QR_ENTRY_URL}
  - label: 今日照護毛孩
    type: postback
    data: action=list_reportable_animals
  - label: 繼續未完成回報
    type: postback
    data: action=resume_draft
  - label: 聯絡工作人員
    type: postback
    data: action=contact_staff
