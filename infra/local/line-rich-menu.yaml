version: 1
name: local-volunteer-care
actions:
  - label: 我要報名志工
    type: postback
    data: action=start_volunteer_application
  - label: 開始照護回報
    type: postback
    data: action=start_care_report
  - label: 掃描 QR Code
    type: uri
    uri: ${LIFF_BASE_URL}?entry=${SHELTER_ENTRY_REFERENCE}
  - label: 今日照護毛孩
    type: postback
    data: action=list_reportable_animals
  - label: 繼續未完成回報
    type: postback
    data: action=resume_draft
  - label: 聯絡工作人員
    type: postback
    data: action=contact_staff
