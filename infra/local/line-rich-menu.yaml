version: 2
menus:
  - key: default
    name: local-adoption-entry
    chat_bar_text: 領養媒合
    actions:
      - label: 領養媒合
        type: postback
        data: action=start_adoption_matching&flow=adoption
      - label: 毛孩日記
        type: postback
        data: action=start_growth_diary&flow=growth_diary
  - key: volunteer
    name: local-volunteer-care
    chat_bar_text: 志工照護回報
    actions:
      - label: 開始照護回報
        type: postback
        data: action=start_care_report
      - label: 掃描 QR Code
        type: uri
        uri: ${LIFF_QR_ENTRY_URL}
      - label: 今日照護毛孩
        type: postback
        data: action=list_reportable_animals
      - label: 繼續未完成回報
        type: postback
        data: action=resume_draft
      - label: 聯絡工作人員
        type: postback
        data: action=contact_staff
  - key: region_select
    name: local-adoption-region-select
    chat_bar_text: 選擇地區
    actions:
      - label: 北區
        type: postback
        data: action=select_region&flow=adoption&value=north
      - label: 中區
        type: postback
        data: action=select_region&flow=adoption&value=central
      - label: 南區
        type: postback
        data: action=select_region&flow=adoption&value=south
      - label: 東區
        type: postback
        data: action=select_region&flow=adoption&value=east
  - key: path_select
    name: local-adoption-path-select
    chat_bar_text: 選擇領養方式
    actions:
      - label: 我心有所屬
        type: postback
        data: action=choose_path&flow=adoption&value=specific_animal
      - label: 請推薦給我
        type: postback
        data: action=choose_path&flow=adoption&value=recommend_me
