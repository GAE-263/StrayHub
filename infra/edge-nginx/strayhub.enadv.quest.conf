server {
    listen 80;
    listen [::]:80;
    server_name strayhub.enadv.quest;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name strayhub.enadv.quest;

    ssl_certificate /etc/letsencrypt/live/strayhub.enadv.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strayhub.enadv.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        proxy_pass http://34.81.77.204:8080;
    }

    location = /v1 {
        proxy_pass http://34.81.77.204:8080;
    }

    location ^~ /v1/ {
        proxy_pass http://34.81.77.204:8080;
    }

    location / {
        proxy_pass http://34.81.77.204:3000;
    }
}
