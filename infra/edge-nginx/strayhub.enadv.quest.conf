map $uri $strayhub_sensitive_access {
    default 0;
    ~^/(login|volunteer-entry|volunteer-application|animal-confirmation)/?$ 1;
    ~^/v1/auth/(login|refresh|liff/exchange)/?$ 1;
    ~^/v1/auth/(google|account|invitations|join-target|join-applications)(/|$) 1;
    ~^/v1/organizations/[^/]+/(invitations|join-applications)(/|$) 1;
    ~^/account(/|$) 1;
    ~^/v1/public/(adoption/)?animals/[^/]+/photo/?$ 1;
}

map $strayhub_sensitive_access $strayhub_standard_access {
    0 1;
    1 0;
}

log_format strayhub_standard
    '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
log_format strayhub_sensitive
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name strayhub.enadv.quest;

    access_log /var/log/nginx/access.log strayhub_standard if=$strayhub_standard_access;
    access_log /var/log/nginx/access.log strayhub_sensitive if=$strayhub_sensitive_access;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name strayhub.enadv.quest;

    access_log /var/log/nginx/access.log strayhub_standard if=$strayhub_standard_access;
    access_log /var/log/nginx/access.log strayhub_sensitive if=$strayhub_sensitive_access;

    ssl_certificate /etc/letsencrypt/live/strayhub.enadv.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strayhub.enadv.quest/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        proxy_pass http://10.43.0.2:8080;
    }

    location = /v1 {
        proxy_pass http://10.43.0.2:8080;
    }

    location ^~ /v1/ {
        proxy_pass http://10.43.0.2:8080;
    }

    location / {
        proxy_pass http://10.43.0.2:3000;
    }
}
