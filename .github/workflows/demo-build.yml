name: GCP Demo Build Gate

on:
  pull_request:
    paths:
      - ".github/workflows/demo-build.yml"
      - "infra/gcp-demo/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-build.yml"
      - "infra/gcp-demo/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  id-token: write

jobs:
  demo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/contracts/package-lock.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: uv sync --dev
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix packages/contracts
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -p no:warnings
      - run: npm --prefix apps/web run quality
      - run: npm --prefix packages/contracts run check

      - name: Terraform format and validate
        working-directory: infra/gcp-demo/terraform
        run: |
          terraform fmt -check -recursive .
          terraform init -backend=false -input=false
          terraform validate

      - name: Secret scan
        run: |
          ! rg -n --hidden \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/.terraform/**' \
            --glob '!**/*.lock' \
            '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|LINE_CHANNEL_ACCESS_[T]OKEN=)' \
            infra/gcp-demo

      - name: Build container images
        run: |
          docker build -f infra/gcp-demo/Dockerfile.api -t strayhub-demo-api:${GITHUB_SHA} .
          docker build -f infra/gcp-demo/Dockerfile.worker -t strayhub-demo-worker:${GITHUB_SHA} .
          docker build -f infra/gcp-demo/Dockerfile.web -t strayhub-demo-web:${GITHUB_SHA} .

      - uses: docker/metadata-action@v5
        id: image-metadata
        with:
          images: strayhub-demo
          tags: |
            type=sha
            type=raw,value=gcp-demo

      - name: Upload build metadata
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "metadata=${{ steps.image-metadata.outputs.tags }}"
            echo "terraform_apply=false"
          } > demo-build-metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: strayhub-gcp-demo-build-metadata
          path: demo-build-metadata.txt
