name: Build Immutable Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact lowercase 40-character main SHA to build or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immutable-release-${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish immutable release
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: release-publication
    outputs:
      artifact_image: ${{ steps.identity.outputs.artifact_image }}
      git_sha: ${{ env.REVISION }}
    permissions:
      contents: read
      id-token: write
    env:
      REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact main source revision
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          [[ -z "$(git status --porcelain)" ]]
      - id: config
        name: Validate versioned non-secret release configuration
        run: python3 -m scripts.manual_release_gate export-application-config --config infra/gce/application-release-config.json --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.publisher }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - name: Expose BuildKit cache v2 runtime
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Configure Artifact Registry Docker authentication
        env:
          REGISTRY: ${{ steps.config.outputs.registry }}
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
      - name: Build or resume exact immutable release
        env:
          REGISTRY: ${{ steps.config.outputs.registry }}
        run: scripts/build-immutable-release.sh --git-sha "$REVISION" --registry "$REGISTRY" --output-dir release-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: strayhub-immutable-release-${{ env.REVISION }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Record immutable release identity
        id: identity
        run: |
          cat release-bundle/artifact-identity.env >>"$GITHUB_OUTPUT"
          cat release-bundle/artifact-identity.env >>"$GITHUB_STEP_SUMMARY"
          printf 'Actions artifact is a convenience copy; Artifact Registry is the canonical release store.\n' >>"$GITHUB_STEP_SUMMARY"

  staging:
    name: Hosted Docker Staging
    needs: build-release
    # Historical builds remain reusable, but only the workflow's own main SHA
    # can issue promotion evidence. Each hosted runner has disposable data.
    if: ${{ needs.build-release.outputs.git_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publication
    permissions:
      contents: read
      id-token: write
    env:
      REVISION: ${{ needs.build-release.outputs.git_sha }}
      RELEASE_ARTIFACT: ${{ needs.build-release.outputs.artifact_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - id: config
        run: python3 -m scripts.manual_release_gate export-application-config --config infra/gce/application-release-config.json --github-output "$GITHUB_OUTPUT"
      # Reuse the existing workflow/environment publisher trust for registry
      # pulls. No deployer identity or production runtime secrets are used.
      - uses: google-github-actions/auth@v2
        id: registry_auth
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.publisher }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.registry_auth.outputs.access_token }}
      - name: Create disposable synthetic staging configuration
        run: uv run python -m scripts.staging_attestation prepare --directory "$RUNNER_TEMP/staging-secrets"
      - name: Verify exact OCI release with canonical Docker acceptance
        run: |
          uv run python -m scripts.local_staging \
            --context default --artifact "$RELEASE_ARTIFACT" \
            --env-file "$RUNNER_TEMP/staging-secrets/staging.env" \
            --work-dir "$RUNNER_TEMP/staging-attempt" --confirm-local-secrets
      - name: Issue hosted staging attestation
        env:
          STAGING_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          uv run python -m scripts.staging_attestation create \
            --receipt "$RUNNER_TEMP/staging-attempt/staging-receipt.json" \
            --output "$RUNNER_TEMP/staging-attestation.json" \
            --git-sha "$REVISION" --artifact "$RELEASE_ARTIFACT"
      - uses: actions/upload-artifact@v4
        id: attestation
        with:
          name: strayhub-staging-${{ env.REVISION }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-attestation.json
          if-no-files-found: error
          retention-days: 30
      - name: Record staging promotion evidence
        env:
          ARTIFACT_ID: ${{ steps.attestation.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.attestation.outputs.artifact-digest }}
        run: |
          printf 'Staging run: `%s`\nStaging artifact identity: `%s:%s`\n' "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_SHA256" >>"$GITHUB_STEP_SUMMARY"
          printf 'Scope: hosted Docker, synthetic data; cloud/LINE checks excluded. Production requires a separate manual gate.\n' >>"$GITHUB_STEP_SUMMARY"
