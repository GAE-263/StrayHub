name: GCE Immutable Release

on:
  pull_request:
    paths:
      - ".github/workflows/gce-release.yml"
      - "infra/gce/**"
      - "infra/gcp-platform/**"
      - "infra/gce/images/Dockerfile.*"
      - "scripts/build-release-bundle.sh"
      - "scripts/verify_acceptance_live.py"
      - "services/**"
      - "tests/contract/test_gce_release_contract.py"
      - "tests/contract/test_gcp_platform_terraform_contract.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    # Every release commit must run the complete release pipeline. Do not add a path filter here:
    # frontend-only and documentation-bundled releases are still production candidates.
    branches: [main, release]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable release images and bundle after verification
        required: true
        default: false
        type: boolean
      deploy:
        description: Deploy the published release (release branch only)
        required: true
        default: false
        type: boolean
      schema_compatibility:
        description: Reviewed rollback compatibility for the release
        required: true
        default: unknown
        type: choice
        options:
          - unknown
          - forward-only
          - backward-compatible-with-previous

permissions:
  contents: read

concurrency:
  # Keep deployment and its receipt verification atomic relative to the next release workflow.
  group: gce-immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-quality-gate:
    name: Full repository quality gate
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    uses: ./.github/workflows/ci.yml

  verify-release:
    name: Verify GCE release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: uv sync --dev

      - name: Python quality and release contracts
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest \
            tests/contract/test_gce_release_contract.py \
            tests/contract/test_gce_acceptance_isolation_contract.py \
            tests/contract/test_gce_production_compose_contract.py \
            tests/contract/test_gce_systemd_contract.py \
            tests/contract/test_gcp_platform_terraform_contract.py

      - name: Shell syntax and lint
        run: |
          bash -n scripts/build-release-bundle.sh
          bash -n infra/gce/scripts/deploy-release-ci.sh
          bash -n infra/gce/scripts/deploy-release.sh
          bash -n infra/gce/scripts/rollback-release.sh
          bash -n infra/gce/scripts/verify-release-receipt.sh
          bash -n infra/gce/scripts/acceptance-preflight.sh
          bash -n infra/gce/scripts/cleanup-acceptance.sh
          shellcheck \
            scripts/build-release-bundle.sh \
            infra/gce/scripts/deploy-release-ci.sh \
            infra/gce/scripts/deploy-release.sh \
            infra/gce/scripts/rollback-release.sh \
            infra/gce/scripts/verify-release-receipt.sh \
            infra/gce/scripts/acceptance-preflight.sh \
            infra/gce/scripts/cleanup-acceptance.sh

      - name: Production Compose and preflight contract
        run: |
          ./infra/gce/scripts/preflight.sh
          docker compose \
            -f infra/gce/docker-compose.production.yml \
            --env-file infra/gce/.env.production.example \
            config --quiet

      - name: Terraform validation without backend access
        run: |
          terraform fmt -check -recursive \
            infra/gce/terraform \
            infra/gcp-platform/terraform
          terraform -chdir=infra/gce/terraform init -backend=false -input=false
          terraform -chdir=infra/gce/terraform validate
          terraform -chdir=infra/gcp-platform/terraform init -backend=false -input=false
          terraform -chdir=infra/gcp-platform/terraform validate

      - name: Repository-native secret scan
        run: |
          ! rg -n --hidden \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!**/.venv/**' \
            --glob '!**/.terraform/**' \
            --glob '!**/*.lock' \
            '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' \
            .

      - name: Build clean-SHA images without publication
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f infra/gce/images/Dockerfile.api -t "strayhub-api:$REVISION" .
          docker build \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f infra/gce/images/Dockerfile.worker -t "strayhub-worker:$REVISION" .
          docker build \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f infra/gce/images/Dockerfile.web -t "strayhub-web:$REVISION" .

  publish-release:
    name: Publish immutable release candidate
    needs: [full-quality-gate, verify-release]
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    environment: release-publication
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      release_id: ${{ steps.bundle.outputs.release_id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require publication configuration
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          PUBLISHER: ${{ vars.GCP_RELEASE_PUBLISHER_SERVICE_ACCOUNT }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          [[ -n "$REGISTRY" ]]
          [[ -n "$PUBLISHER" ]]
          [[ -n "$PROVIDER" ]]

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_PUBLISHER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to the dedicated registry
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          registry_host="${REGISTRY%%/*}"
          gcloud auth configure-docker "$registry_host" --quiet

      - name: Build and push exact Git SHA images
        id: images
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          REVISION: ${{ github.sha }}
        run: |
          for service in api worker web; do
            image="$REGISTRY/strayhub-$service:$REVISION"
            docker build \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              -f "infra/gce/images/Dockerfile.$service" -t "$image" .
            docker push "$image"
            reference="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
            [[ "$reference" == *@sha256:* ]]
            printf '%s_image=%s\n' "$service" "$reference" >>"$GITHUB_OUTPUT"
          done

      - name: Build and validate immutable release bundle
        id: bundle
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker_image }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          SCHEMA_COMPATIBILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_compatibility || 'unknown' }}
        run: |
          chmod +x scripts/build-release-bundle.sh infra/gce/scripts/release-manifest.py
          ./scripts/build-release-bundle.sh \
            --git-sha "${{ github.sha }}" \
            --api-image "$API_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --web-image "$WEB_IMAGE" \
            --schema-compatibility "$SCHEMA_COMPATIBILITY" \
            --ci-run-id "${{ github.run_id }}" \
            --ci-workflow "${{ github.workflow }}" \
            --output-dir release-bundle
          release_id="$(python3 infra/gce/scripts/release-manifest.py show-field \
            --manifest release-bundle/release-manifest.json --field release_id)"
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: strayhub-gce-release-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy release to production GCE
    needs: publish-release
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy &&
           github.ref == 'refs/heads/release') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://strayhub.enadv.quest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse stale release candidates
        run: |
          git fetch --no-tags origin refs/heads/release:refs/remotes/origin/release
          [[ "$(git rev-parse refs/remotes/origin/release)" == "$GITHUB_SHA" ]]

      - name: Download and validate release artifact
        env:
          ARTIFACT_ID: ${{ needs.publish-release.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.publish-release.outputs.artifact_digest }}
          EXPECTED_RELEASE_ID: ${{ needs.publish-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact_archive="$RUNNER_TEMP/strayhub-gce-release-$GITHUB_SHA.zip"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            >"$artifact_archive"
          printf '%s  %s\n' "$EXPECTED_ARTIFACT_DIGEST" "$artifact_archive" | sha256sum --check -
          mkdir release-bundle
          unzip -q "$artifact_archive" -d release-bundle
          python3 infra/gce/scripts/release-manifest.py validate-artifact \
            --artifact-dir release-bundle
          [[ "$(python3 infra/gce/scripts/release-manifest.py show-field \
            --manifest release-bundle/release-manifest.json --field git_sha)" == "$GITHUB_SHA" ]]
          [[ "$(python3 infra/gce/scripts/release-manifest.py show-field \
            --manifest release-bundle/release-manifest.json --field release_id)" == \
            "$EXPECTED_RELEASE_ID" ]]

      - name: Require deployment configuration
        env:
          DEPLOYER: ${{ vars.GCP_RELEASE_DEPLOYER_SERVICE_ACCOUNT }}
          INSTANCE: ${{ vars.GCP_PRODUCTION_INSTANCE }}
          PROJECT: ${{ vars.GCP_PRODUCTION_PROJECT }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ZONE: ${{ vars.GCP_PRODUCTION_ZONE }}
        run: |
          [[ -n "$DEPLOYER" ]]
          [[ -n "$INSTANCE" ]]
          [[ -n "$PROJECT" ]]
          [[ -n "$PROVIDER" ]]
          [[ -n "$ZONE" ]]

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Transfer and deploy validated release over IAP
        env:
          GCP_INSTANCE: ${{ vars.GCP_PRODUCTION_INSTANCE }}
          GCP_PROJECT: ${{ vars.GCP_PRODUCTION_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_PRODUCTION_ZONE }}
        run: |
          infra/gce/scripts/deploy-release-ci.sh \
            --artifact-dir release-bundle \
            --git-sha "$GITHUB_SHA" \
            --instance "$GCP_INSTANCE" \
            --project "$GCP_PROJECT" \
            --run-id "$GITHUB_RUN_ID" \
            --zone "$GCP_ZONE"

  verify-production:
    name: Verify production release
    needs: [publish-release, deploy-production]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://strayhub.enadv.quest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify exact receipt and runtime over IAP
        env:
          GCP_INSTANCE: ${{ vars.GCP_PRODUCTION_INSTANCE }}
          GCP_PROJECT: ${{ vars.GCP_PRODUCTION_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_PRODUCTION_ZONE }}
          RELEASE_ID: ${{ needs.publish-release.outputs.release_id }}
        run: |
          gcloud compute ssh "$GCP_INSTANCE" \
            --project "$GCP_PROJECT" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo -n /opt/strayhub/current/infra/gce/scripts/verify-release-receipt.sh --git-sha '$GITHUB_SHA' --release-id '$RELEASE_ID'"

      - name: Verify canonical public health
        run: |
          curl --fail --silent --show-error --max-time 15 https://strayhub.enadv.quest/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://strayhub.enadv.quest/healthz >/dev/null
