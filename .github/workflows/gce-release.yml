name: GCE Immutable Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      operation:
        description: Verification, immutable publication, or separate receipt-backed deployment
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
          - deploy
      git_sha:
        description: Exact lowercase 40-character release HEAD
        required: true
        type: string
      confirmation:
        description: Exact operation confirmation including the full SHA
        required: false
        type: string
      schema_compatibility:
        description: Reviewed rollback compatibility for publication
        required: true
        default: unknown
        type: choice
        options: [unknown, forward-only, backward-compatible-with-previous]
      publication_run_id:
        description: Successful prior publication workflow run ID (deploy only)
        required: false
        type: string
      publication_artifact_id:
        description: Exact prior publication artifact ID (deploy only)
        required: false
        type: string
      publication_artifact_sha256:
        description: Exact SHA-256 of the prior publication artifact archive (deploy only)
        required: false
        type: string
      release_bundle_sha256:
        description: Exact bundle SHA-256 from the verified publication receipt (deploy only)
        required: false
        type: string
      staging_run_id:
        description: Successful hosted Docker staging run ID (deploy only)
        required: false
        type: string
      staging_artifact_identity:
        description: Exact staging attestation artifact ID:SHA256 (deploy only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gce-immutable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-quality-gate:
    name: Full repository quality gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'deploy' }}
    uses: ./.github/workflows/ci.yml

  authorize-manual-write:
    name: Authorize exact manual write operation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && (inputs.operation == 'publish' || inputs.operation == 'deploy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse stale release candidates and verify manual confirmation
        env:
          BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          release_sha="$INPUT_SHA"
          args=(gate --operation "$OPERATION" --confirmation "$CONFIRMATION" --git-sha "$INPUT_SHA" --checkout-sha "$checkout_sha" --release-sha "$release_sha")
          if [[ -n "$BUNDLE_SHA256" ]]; then args+=(--bundle-sha256 "$BUNDLE_SHA256"); fi
          python3 -m scripts.manual_release_gate "${args[@]}" --actor '${{ github.actor }}' --triggering-actor '${{ github.triggering_actor }}' --run-attempt '${{ github.run_attempt }}'
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$checkout_sha"
          printf '### Authorized `%s` for `%s`\n' "$OPERATION" "$release_sha" >>"$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish immutable release candidate
    needs: [full-quality-gate, authorize-manual-write]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    # OIDC namespace only; not an approval, secret, or variable gate.
    environment: release-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize and revalidate current release before publication credentials
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          python3 -m scripts.manual_release_gate gate --operation publish --confirmation "$CONFIRMATION" --git-sha "$INPUT_SHA" --checkout-sha "$(git rev-parse HEAD)" --release-sha "$INPUT_SHA" --actor '${{ github.actor }}' --triggering-actor '${{ github.triggering_actor }}' --run-attempt '${{ github.run_attempt }}'
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)"
      - id: config
        name: Validate versioned non-secret release configuration
        run: python3 -m scripts.manual_release_gate export-application-config --config infra/gce/application-release-config.json --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.publisher }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Download and validate canonical main release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
          REGISTRY: ${{ steps.config.outputs.registry }}
          REVISION: ${{ inputs.git_sha }}
        run: |
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)"
          gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)"
          scripts/build-immutable-release.sh --git-sha "$REVISION" --registry "$REGISTRY" --output-dir release-bundle --reuse-only
      - name: Build and validate immutable release bundle and receipt
        run: |
          python3 -m scripts.manual_release_gate create-publication-receipt --manifest release-bundle/release-manifest.json --output release-bundle/publication-receipt.json --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        id: publication_artifact
        with:
          name: strayhub-gce-publication-${{ inputs.git_sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Record publication identity
        run: |
          printf 'Publication artifact ID: `%s`\n' '${{ steps.publication_artifact.outputs.artifact-id }}' >>"$GITHUB_STEP_SUMMARY"
          printf 'Publication artifact SHA-256: `%s`\n' '${{ steps.publication_artifact.outputs.artifact-digest }}' >>"$GITHUB_STEP_SUMMARY"
          printf 'Deployment performed: `false`\n' >>"$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy previously published release to production GCE
    needs: authorize-manual-write
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://strayhub.enadv.quest
    outputs:
      release_id: ${{ steps.artifact.outputs.release_id }}
      deployed_sha: ${{ steps.artifact.outputs.deployed_sha }}
      bundle_sha256: ${{ steps.artifact.outputs.bundle_sha256 }}
      publication_run_id: ${{ steps.artifact.outputs.publication_run_id }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: artifact
        name: Download and validate prior publication receipt
        env:
          ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.publication_artifact_sha256 }}
          BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PUBLICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ && "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          run_json="$RUNNER_TEMP/publication-run.json"
          artifact_json="$RUNNER_TEMP/publication-artifact.json"
          archive="$RUNNER_TEMP/publication.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID" >"$run_json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); e={"event":"workflow_dispatch","head_branch":"release","head_sha":sys.argv[2],"conclusion":"success","path":".github/workflows/gce-release.yml"}; any(r.get(k)!=v for k,v in e.items()) and sys.exit("prior publication run identity mismatch")' "$run_json" "$INPUT_SHA"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" >"$artifact_json"
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); d=str(a.get("digest","")).removeprefix("sha256:"); ok=a.get("workflow_run",{}).get("id")==int(sys.argv[2]) and a.get("name")==f"strayhub-gce-publication-{sys.argv[3]}" and a.get("expired") is False and d==sys.argv[4]; sys.exit(0 if ok else "publication artifact metadata mismatch")' "$artifact_json" "$PUBLICATION_RUN_ID" "$INPUT_SHA" "$ARTIFACT_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >"$archive"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$archive" | sha256sum --check -
          mkdir release-bundle
          unzip -q "$archive" -d release-bundle
          python3 infra/gce/scripts/release-manifest.py validate-artifact --artifact-dir release-bundle
          python3 -m scripts.manual_release_gate validate-publication-receipt --receipt release-bundle/publication-receipt.json --manifest release-bundle/release-manifest.json --git-sha "$INPUT_SHA" --bundle-sha256 "$BUNDLE_SHA256" --run-id "$PUBLICATION_RUN_ID"
          release_id="$(python3 infra/gce/scripts/release-manifest.py show-field --manifest release-bundle/release-manifest.json --field release_id)"
          printf 'release_id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"
          printf 'deployed_sha=%s\n' "$INPUT_SHA" >>"$GITHUB_OUTPUT"
          printf 'bundle_sha256=%s\n' "$BUNDLE_SHA256" >>"$GITHUB_OUTPUT"
          printf 'publication_run_id=%s\n' "$PUBLICATION_RUN_ID" >>"$GITHUB_OUTPUT"
      - name: Validate hosted staging evidence before deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_ARTIFACT_IDENTITY: ${{ inputs.staging_artifact_identity }}
          INPUT_SHA: ${{ inputs.git_sha }}
          BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
        run: |
          python3 -m scripts.staging_attestation verify \
            --run-id "$STAGING_RUN_ID" --artifact-identity "$STAGING_ARTIFACT_IDENTITY" \
            --git-sha "$INPUT_SHA" --bundle-sha256 "$BUNDLE_SHA256" --publication release-bundle
      - id: config
        name: Validate versioned non-secret deployment configuration
        run: python3 -m scripts.manual_release_gate export-application-config --config infra/gce/application-release-config.json --github-output "$GITHUB_OUTPUT"
      - name: Authorize and revalidate current release before deployment credentials
        env:
          BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          python3 -m scripts.manual_release_gate gate --operation deploy --confirmation "$CONFIRMATION" --git-sha "$INPUT_SHA" --checkout-sha "$(git rev-parse HEAD)" --release-sha "$INPUT_SHA" --bundle-sha256 "$BUNDLE_SHA256" --actor '${{ github.actor }}' --triggering-actor '${{ github.triggering_actor }}' --run-attempt '${{ github.run_attempt }}'
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Transfer and deploy validated release over IAP
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)"
          infra/gce/scripts/deploy-release-ci.sh --artifact-dir release-bundle --git-sha "$INPUT_SHA" --instance "${{ steps.config.outputs.instance }}" --project "${{ steps.config.outputs.project_id }}" --run-id "$GITHUB_RUN_ID" --zone "${{ steps.config.outputs.zone }}"

  verify-production:
    name: Verify production release
    needs: deploy-production
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && inputs.operation == 'deploy' && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind verification to the successful deployment in this run
        env:
          DEPLOYED_BUNDLE_SHA256: ${{ needs.deploy-production.outputs.bundle_sha256 }}
          DEPLOYED_PUBLICATION_RUN_ID: ${{ needs.deploy-production.outputs.publication_run_id }}
          DEPLOYED_SHA: ${{ needs.deploy-production.outputs.deployed_sha }}
          INPUT_BUNDLE_SHA256: ${{ inputs.release_bundle_sha256 }}
          INPUT_PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
          INPUT_SHA: ${{ inputs.git_sha }}
        run: |
          python3 -m scripts.manual_release_gate run-identity --actor '${{ github.actor }}' --triggering-actor '${{ github.triggering_actor }}' --run-attempt '${{ github.run_attempt }}'
          [[ "$DEPLOYED_SHA" == "$INPUT_SHA" && "$DEPLOYED_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$INPUT_SHA" ]]
          [[ "$DEPLOYED_BUNDLE_SHA256" == "$INPUT_BUNDLE_SHA256" && "$DEPLOYED_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOYED_PUBLICATION_RUN_ID" == "$INPUT_PUBLICATION_RUN_ID" && "$DEPLOYED_PUBLICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - id: release_state
        name: Record whether release advanced after the completed deployment
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.git_sha }}
        run: python3 -m scripts.release_head_gate --requested-sha "$INPUT_SHA" --github-sha "$GITHUB_SHA" --checkout-sha "$(git rev-parse HEAD)" --allow-superseded --github-output "$GITHUB_OUTPUT"
      - name: Record deployed release status
        run: |
          printf 'Deployed SHA: `%s`\n' '${{ needs.deploy-production.outputs.deployed_sha }}' >>"$GITHUB_STEP_SUMMARY"
          printf 'Current release SHA: `%s`\n' '${{ steps.release_state.outputs.current_release_sha }}' >>"$GITHUB_STEP_SUMMARY"
          printf 'release_superseded_after_deploy=`%s`\n' '${{ steps.release_state.outputs.release_superseded_after_deploy }}' >>"$GITHUB_STEP_SUMMARY"
      - id: config
        run: python3 -m scripts.manual_release_gate export-application-config --config infra/gce/application-release-config.json --github-output "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.config.outputs.provider }}
          service_account: ${{ steps.config.outputs.deployer }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Establish verification SSH transport
        env:
          VERIFY_INSTANCE: ${{ steps.config.outputs.instance }}
          VERIFY_PROJECT: ${{ steps.config.outputs.project_id }}
          VERIFY_ZONE: ${{ steps.config.outputs.zone }}
        run: |
          # New runners have new OS Login keys. Retry only authentication for a
          # side-effect-free probe; never retry deployment or receipt verification.
          for attempt in 1 2 3; do
            if output="$(gcloud compute ssh "$VERIFY_INSTANCE" --project "$VERIFY_PROJECT" --zone "$VERIFY_ZONE" --tunnel-through-iap --quiet --ssh-flag='-o ConnectTimeout=15' --command true 2>&1)"; then
              break
            else
              status=$?
            fi
            if [[ "$status" != 255 || "$output" != *'Permission denied (publickey)'* || "$attempt" == 3 ]]; then
              printf 'Verification SSH transport failed (exit=%s).\n' "$status" >&2
              exit "$status"
            fi
            printf 'Verification SSH authentication unavailable; waiting before probe %s/3.\n' "$((attempt + 1))"
            sleep 10
          done
      - name: Verify exact receipt and runtime over IAP
        run: gcloud compute ssh "${{ steps.config.outputs.instance }}" --project "${{ steps.config.outputs.project_id }}" --zone "${{ steps.config.outputs.zone }}" --tunnel-through-iap --quiet --command "sudo -n /opt/strayhub/current/infra/gce/scripts/verify-release-receipt.sh --git-sha '${{ inputs.git_sha }}' --release-id '${{ needs.deploy-production.outputs.release_id }}'"
      - name: Verify canonical public health
        run: |
          curl --fail --silent --show-error --max-time 15 https://strayhub.enadv.quest/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://strayhub.enadv.quest/healthz >/dev/null
