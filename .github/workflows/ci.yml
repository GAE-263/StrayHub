name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strayhub_test
          POSTGRES_USER: strayhub
          POSTGRES_PASSWORD: strayhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strayhub -d strayhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://strayhub:strayhub@127.0.0.1:5432/strayhub_test
      STRAYHUB_TEST_DATABASE_URL: postgresql://strayhub:strayhub@127.0.0.1:5432/strayhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Install nginx runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes nginx
      - run: uv sync --dev
      - name: Sensitive transport static policy
        run: uv run python scripts/check_sensitive_transport_policy.py
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web run build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci --prefix packages/contracts
      - run: npm --prefix packages/contracts run check

  critical-e2e:
    name: Critical E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e:critical
