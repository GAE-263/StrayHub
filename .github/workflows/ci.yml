name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strayhub
          POSTGRES_USER: strayhub
          POSTGRES_PASSWORD: strayhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strayhub -d strayhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://strayhub:strayhub@127.0.0.1:5432/strayhub
      STRAYHUB_TEST_DATABASE_URL: postgresql://strayhub:strayhub@127.0.0.1:5432/strayhub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
