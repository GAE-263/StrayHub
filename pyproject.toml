[project]
name = "strayhub"
version = "0.1.0"
description = "浪浪森友會志工日常照護回報與動物近期歷程"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "boto3>=1.34,<2",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "google-cloud-kms>=3,<4",
  "google-auth>=2.38,<3",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "starlette>=0.46,<1",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn[standard]>=0.32,<1",
  "zxing-cpp==3.1.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Existing UTC-aware code remains intentionally explicit as `timezone.utc`;
# a repository-wide datetime API migration is outside T225-T238.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
  "contract: validates external or generated contracts",
  "e2e: validates a cross-boundary user journey",
  "integration: validates multiple application or infrastructure boundaries",
  "isolation: validates tenant and scope isolation",
  "quality: validates the complete local feature quality matrix",
  "security: validates a focused security control",
  "unit: validates a pure domain or application unit",
]

[tool.mypy]
python_version = "3.12"
# The current typed boundary covers domain, observability and database setup;
# repository/application SQLAlchemy result typing remains an incremental follow-up.
files = ["services/api/app/domain", "services/api/app/observability", "services/api/app/persistence/database"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
