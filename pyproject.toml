[project]
name = "strayhub"
version = "0.1.0"
description = "浪浪森友會志工日常照護回報與動物近期歷程"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.29,<1",
  "boto3>=1.34,<2",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["services", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["."]
