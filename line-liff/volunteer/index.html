<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>志工選單 · 浪浪森友會</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream: "#FAF6EE", cocoa: "#716053", blossom: "#FFB4A2", sunny: "#FFD79A", leaf: "#A7C4A0" } } } };
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{background:#FAF6EE;font-family:"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
  .card{border:3px solid #716053;border-radius:1.25rem;background:#fff}
  input,textarea,select{border:2px solid #716053;border-radius:.75rem}
</style>
</head>
<body class="text-cocoa">
<!-- ============================================================
  志工選單 LIFF（框架）— 對應 StrayHub 志工 Rich Menu 的兩個項目：
  散步回報 / 志工報到。目前為 mock，串接後端見底部 CONFIG 與 api()。
  ============================================================ -->
<main class="max-w-md mx-auto p-5 space-y-5" style="padding-top:env(safe-area-inset-top)">
  <header class="text-center pt-4">
    <h1 class="text-2xl font-bold">🐾 志工選單</h1>
    <p id="who" class="text-sm text-cocoa/70 mt-1">登入中…</p>
  </header>

  <!-- 主選單 -->
  <section id="home" class="space-y-3">
    <button data-go="walk" class="w-full card p-5 text-left text-lg font-bold flex items-center gap-3">🚶 散步回報<span class="ml-auto text-cocoa/40">›</span></button>
    <button data-go="checkin" class="w-full card p-5 text-left text-lg font-bold flex items-center gap-3">✅ 志工報到<span class="ml-auto text-cocoa/40">›</span></button>
  </section>

  <!-- 散步回報 -->
  <section id="walk" class="hidden card p-5 space-y-3">
    <h2 class="text-xl font-bold">🚶 散步回報</h2>
    <label class="block text-sm">動物 ID / 收容編號
      <input id="walk-animal" class="w-full mt-1 p-2" placeholder="例如 A20260826-7431" /></label>
    <label class="block text-sm">散步時長（分鐘）
      <input id="walk-min" type="number" class="w-full mt-1 p-2" placeholder="30" /></label>
    <label class="block text-sm">狀況說明
      <textarea id="walk-note" rows="3" class="w-full mt-1 p-2" placeholder="今天很有活力…"></textarea></label>
    <div class="flex gap-2 pt-1">
      <button data-go="home" class="flex-1 p-3 rounded-xl border-2 border-cocoa/40">返回</button>
      <button data-submit="walk" class="flex-1 p-3 rounded-xl bg-leaf text-cocoa font-bold border-2 border-cocoa">送出</button>
    </div>
  </section>

  <!-- 志工報到 -->
  <section id="checkin" class="hidden card p-5 space-y-3 text-center">
    <h2 class="text-xl font-bold">✅ 志工報到</h2>
    <p class="text-sm text-cocoa/70">按下按鈕即完成今日報到。</p>
    <button data-submit="checkin" class="w-full p-4 rounded-xl bg-sunny text-cocoa font-bold border-2 border-cocoa text-lg">我要報到</button>
    <button data-go="home" class="w-full p-3 rounded-xl border-2 border-cocoa/40">返回</button>
  </section>

  <p id="toast" class="hidden text-center text-sm bg-leaf/40 border-2 border-leaf rounded-xl p-3"></p>
</main>

<script type="module">
// ---- CONFIG（對接時改這裡）----
const CONFIG = {
  LIFF_ID: "YOUR_VOLUNTEER_LIFF_ID",
  API_BASE_URL: "https://your-strayhub-api.example.com/v1",
  MOCK_MODE: true, // 上線改 false
};
const MOCK_PROFILE = { userId: "U-mock-volunteer", displayName: "測試志工小美", pictureUrl: "" };

async function initLogin(){
  if(CONFIG.MOCK_MODE){ await new Promise(r=>setTimeout(r,300)); return MOCK_PROFILE; }
  await liff.init({ liffId: CONFIG.LIFF_ID });
  if(!liff.isLoggedIn()){ liff.login(); return new Promise(()=>{}); }
  return liff.getProfile();
}
// ---- API（mock；接後端把 MOCK_MODE 改 false 並實作 fetch）----
async function api(path, payload){
  if(CONFIG.MOCK_MODE){ console.log("[mock] POST", path, payload); await new Promise(r=>setTimeout(r,500)); return {success:true}; }
  const res = await fetch(`${CONFIG.API_BASE_URL}${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!res.ok) throw new Error("送出失敗"); return res.json();
}

const $ = s=>document.querySelector(s);
const show = id => { ["home","walk","checkin"].forEach(x=>$("#"+x).classList.toggle("hidden", x!==id)); $("#toast").classList.add("hidden"); };
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); };

document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
document.querySelector('[data-submit="walk"]').onclick = async ()=>{
  const p={ type:"WALK_REPORT", animalId:$("#walk-animal").value.trim(), minutes:Number($("#walk-min").value||0), note:$("#walk-note").value.trim(), by:profile.userId };
  if(!p.animalId){ toast("請先填動物 ID"); return; }
  await api("/care/walk-reports", p); toast("✅ 散步回報已送出（mock）"); setTimeout(()=>show("home"),1200);
};
document.querySelector('[data-submit="checkin"]').onclick = async ()=>{
  await api("/volunteers/checkin", { by:profile.userId, at:new Date().toISOString() });
  toast("✅ 報到成功 "+new Date().toLocaleTimeString("zh-TW")); setTimeout(()=>show("home"),1200);
};

let profile;
initLogin().then(p=>{ profile=p; $("#who").textContent = "你好，"+p.displayName; })
  .catch(()=>$("#who").textContent="登入失敗，請重開");
</script>
</body>
</html>
