<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>領養選單 · 浪浪森友會</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    cream: "#FAF6EE", cocoa: "#716053", blossom: "#FFB4A2", sunny: "#FFD79A", sky: "#9AD0EC" } } } };
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{background:#FAF6EE;font-family:"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
  .card{border:3px solid #716053;border-radius:1.25rem;background:#fff}
  input,textarea,select{border:2px solid #716053;border-radius:.75rem}
</style>
</head>
<body class="text-cocoa">
<!-- ============================================================
  領養人選單 LIFF（框架）— 對應 StrayHub 領養人 Rich Menu 兩項目：
  我想領養 / 領養回報。註：ADOPTER 為新角色，後端角色體系尚未正式納入。
  ============================================================ -->
<main class="max-w-md mx-auto p-5 space-y-5" style="padding-top:env(safe-area-inset-top)">
  <header class="text-center pt-4">
    <h1 class="text-2xl font-bold">🏡 領養選單</h1>
    <p id="who" class="text-sm text-cocoa/70 mt-1">登入中…</p>
  </header>

  <section id="home" class="space-y-3">
    <button data-go="want" class="w-full card p-5 text-left text-lg font-bold flex items-center gap-3">💛 我想領養<span class="ml-auto text-cocoa/40">›</span></button>
    <button data-go="report" class="w-full card p-5 text-left text-lg font-bold flex items-center gap-3">📷 領養回報<span class="ml-auto text-cocoa/40">›</span></button>
  </section>

  <!-- 我想領養 -->
  <section id="want" class="hidden card p-5 space-y-3">
    <h2 class="text-xl font-bold">💛 我想領養</h2>
    <label class="block text-sm">想領養的動物 ID / 收容編號
      <input id="want-animal" class="w-full mt-1 p-2" placeholder="例如 A20260826-7431" /></label>
    <label class="block text-sm">你的稱呼
      <input id="want-name" class="w-full mt-1 p-2" placeholder="王小美" /></label>
    <label class="block text-sm">聯絡方式（電話 / Email）
      <input id="want-contact" class="w-full mt-1 p-2" placeholder="0912-345-678" /></label>
    <label class="block text-sm">想說的話
      <textarea id="want-note" rows="3" class="w-full mt-1 p-2" placeholder="家裡有院子，養過狗…"></textarea></label>
    <div class="flex gap-2 pt-1">
      <button data-go="home" class="flex-1 p-3 rounded-xl border-2 border-cocoa/40">返回</button>
      <button data-submit="want" class="flex-1 p-3 rounded-xl bg-blossom text-cocoa font-bold border-2 border-cocoa">送出意願</button>
    </div>
  </section>

  <!-- 領養回報 -->
  <section id="report" class="hidden card p-5 space-y-3">
    <h2 class="text-xl font-bold">📷 領養回報</h2>
    <label class="block text-sm">已領養動物 ID
      <input id="rep-animal" class="w-full mt-1 p-2" placeholder="例如 A20260826-7431" /></label>
    <label class="block text-sm">近況
      <textarea id="rep-note" rows="3" class="w-full mt-1 p-2" placeholder="適應良好，胖了一點…"></textarea></label>
    <div class="flex gap-2 pt-1">
      <button data-go="home" class="flex-1 p-3 rounded-xl border-2 border-cocoa/40">返回</button>
      <button data-submit="report" class="flex-1 p-3 rounded-xl bg-sky text-cocoa font-bold border-2 border-cocoa">送出回報</button>
    </div>
  </section>

  <p id="toast" class="hidden text-center text-sm bg-sky/40 border-2 border-sky rounded-xl p-3"></p>
</main>

<script type="module">
const CONFIG = {
  LIFF_ID: "YOUR_ADOPTER_LIFF_ID",
  API_BASE_URL: "https://your-strayhub-api.example.com/v1",
  MOCK_MODE: true,
};
const MOCK_PROFILE = { userId: "U-mock-adopter", displayName: "測試領養人阿明", pictureUrl: "" };

async function initLogin(){
  if(CONFIG.MOCK_MODE){ await new Promise(r=>setTimeout(r,300)); return MOCK_PROFILE; }
  await liff.init({ liffId: CONFIG.LIFF_ID });
  if(!liff.isLoggedIn()){ liff.login(); return new Promise(()=>{}); }
  return liff.getProfile();
}
async function api(path, payload){
  if(CONFIG.MOCK_MODE){ console.log("[mock] POST", path, payload); await new Promise(r=>setTimeout(r,500)); return {success:true}; }
  const res = await fetch(`${CONFIG.API_BASE_URL}${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!res.ok) throw new Error("送出失敗"); return res.json();
}

const $ = s=>document.querySelector(s);
const show = id => { ["home","want","report"].forEach(x=>$("#"+x).classList.toggle("hidden", x!==id)); $("#toast").classList.add("hidden"); };
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.remove("hidden"); };
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));

document.querySelector('[data-submit="want"]').onclick = async ()=>{
  const p={ type:"ADOPTION_INTENT", animalId:$("#want-animal").value.trim(), name:$("#want-name").value.trim(), contact:$("#want-contact").value.trim(), note:$("#want-note").value.trim(), by:profile.userId };
  if(!p.animalId || !p.contact){ toast("請填動物 ID 與聯絡方式"); return; }
  await api("/adoptions/intents", p); toast("💛 領養意願已送出（mock），收容所會與你聯繫"); setTimeout(()=>show("home"),1400);
};
document.querySelector('[data-submit="report"]').onclick = async ()=>{
  const p={ type:"ADOPTION_FOLLOWUP", animalId:$("#rep-animal").value.trim(), note:$("#rep-note").value.trim(), by:profile.userId };
  if(!p.animalId){ toast("請填動物 ID"); return; }
  await api("/adoptions/followups", p); toast("📷 領養回報已送出（mock）"); setTimeout(()=>show("home"),1400);
};

let profile;
initLogin().then(p=>{ profile=p; $("#who").textContent = "你好，"+p.displayName; })
  .catch(()=>$("#who").textContent="登入失敗，請重開");
</script>
</body>
</html>
