        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        area_type: { type: string, enum: [area, cage] }
        parent_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, inactive] }
