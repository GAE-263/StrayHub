      type: object
      required: [qr_token]
      properties:
        qr_token: { type: string }
    DraftCreateRequest:
      type: object
      required: [animal_id, confirmation_token]
      properties:
        animal_id: { type: string, format: uuid }
        confirmation_token: { type: string, minLength: 1 }
