        expected_access_version: { type: integer, minimum: 1 }
    MembershipMutationVersionRequest:
      type: object
      required: [expected_access_version]
      properties:
        expected_access_version: { type: integer, minimum: 1 }
    MembershipListResponse:
      type: object
      required: [items]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/Membership" } }
    AccountCreateRequest:
      type: object
      required: [username, display_name, temporary_password, role]
      properties:
        username: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        temporary_password: { type: string, format: password, minLength: 1 }
        role: { type: string, enum: [SHELTER_ADMIN, STAFF, VOLUNTEER] }
    ShelterArea:
      type: object
      required: [id, organization_id, name, area_type, status]
