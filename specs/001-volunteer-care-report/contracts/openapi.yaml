        status: { type: string, enum: [saved, amended, archived] }
        ai_job_status: { type: string }
        media_ids:
          type: array
          items: { type: string, format: uuid }
    ObservationCategoryListResponse:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ObservationCategory" },
          }
