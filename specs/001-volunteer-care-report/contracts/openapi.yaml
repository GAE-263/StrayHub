              type: string
              format: uuid
            shelter_entry_reference:
              type: 'null'
        - required: [shelter_entry_reference]
          properties:
            organization_id:
              type: 'null'
            shelter_entry_reference:
              type: string
              minLength: 32
              maxLength: 512
              pattern: '^[A-Za-z0-9._~-]+$'
    VolunteerApplicationWithdrawRequest:
