            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/platform/administrators/replacements:
    post:
      tags: [Platform Administrators]
      operationId: replacePlatformAdministrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformAdminReplacementRequest' }
      responses:
        '200':
          description: 完成平台管理員替換
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/platform/administrators/candidates:
    get:
      tags: [Platform Administrators]
      operationId: listPlatformAdministratorCandidates
      responses:
        '200':
          description: 可提升為平台管理員的啟用帳號
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformAdminCandidate' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/platform/administrators/audit:
    get:
      tags: [Platform Administrators]
      operationId: listPlatformAdministratorAudit
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: 平台管理員稽核紀錄
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlatformAuditRecord' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/platform/administrators/{userId}/promote:
    post:
      tags: [Platform Administrators]
      operationId: promotePlatformAdministrator
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 提升既有帳號
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/platform/administrators/{userId}/enable:
    post:
      tags: [Platform Administrators]
      operationId: enablePlatformAdministrator
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 重新啟用平台管理員
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/platform/administrators/{userId}/disable:
    post:
      tags: [Platform Administrators]
      operationId: disablePlatformAdministrator
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 停用平台管理員
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/platform/administrators/{userId}/demote:
    post:
      tags: [Platform Administrators]
      operationId: demotePlatformAdministrator
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 降權平台管理員
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAdminMutationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 簽署的短效 Access Token；每次受保護 Request 仍必須通過 Server-side Session 與 Organization Scope 驗證。
  parameters:
    OrganizationId:
      {
        name: organizationId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    MembershipId:
      {
        name: membershipId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AnimalId:
      {
        name: animalId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    SeriesId: { name: seriesId, in: path, required: true, schema: { type: string, format: uuid } }
    OccurrenceId: { name: occurrenceId, in: path, required: true, schema: { type: string, format: uuid } }
    DraftId:
      {
        name: draftId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    MediaId:
      {
        name: mediaId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ReportId:
      {
        name: reportId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    OptionId:
      {
        name: optionId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ObservationId:
      {
        name: observationId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ScopeId:
      {
        name: scopeId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    QrCodeId:
      {
        name: qrId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    LineSignature:
      {
        name: X-Line-Signature,
        in: header,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        name: page_size,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
      }
    PlatformSupportReason:
      name: X-Platform-Support-Reason
      in: header
      required: false
      description: PLATFORM_ADMIN 存取本功能任何 organization-scoped read/write 時必填；SHELTER_ADMIN 可省略
      schema:
        type: string
        minLength: 1
        maxLength: 500
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Webhook 或 Request 格式錯誤
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    AuthResponse:
      description: 本系統 Session 憑證
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    Unauthorized:
      description: 未通過身分驗證
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Forbidden:
      description: 無權限或無法存取，不能洩漏資源存在性
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    NotFoundOrForbidden:
      description: 不存在或未授權的一致結果
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    Conflict:
      description: Idempotency、stale version、operation payload 或資料狀態衝突
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    UnprocessableEntity:
      description: 日期區間或欄位驗證失敗
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ErrorResponse" } },
        }
    EntryUnavailable:
      description: LINE 身分或收容所申請入口不可用；不揭露內部狀態
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagementDenied:
      description: actor 無此 organization 的志工授權管理權
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScopedNotFound:
      description: 在已授權 organization scope 內找不到資源，或不得揭露其存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PiiLifecycleExpired:
      description: 個人資料已依保存政策刪除或超過保存期限；申請歷史仍保留
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 日期、原因、項目數或其他輸入不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: LINE identity/provider 暫時不可用；未建立部分狀態
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LiffIdentityRejected:
      description: LINE ID token無效、過期或audience不符；不揭露claim或provider細節
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LiffIdentityError" }
    LiffEntryUnavailable:
      description: Entry無效、撤銷、過期、purpose不符或organization不可用；不揭露內部原因
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LiffEntryUnavailableError" }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        operation_id: { type: [string, "null"], format: uuid }
        details: { type: object, additionalProperties: true }
    LiffIdentityError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, const: invalid_line_id_token }
        message: { type: string, const: "無法確認 LINE 身分" }
        request_id: { type: string }
    LiffEntryUnavailableError:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: { type: string, const: entry_unavailable }
        message: { type: string, const: "此志工入口目前無法使用" }
        request_id: { type: string }
    ManagementDashboard:
      type: object
      required: [organization_id, role, summary, recent_reports]
      properties:
        organization_id: { type: string, format: uuid }
        role: { type: string }
        summary:
          type: object
          required:
            [
              reportable_animal_count,
              today_report_count,
              active_draft_count,
              pending_ai_count,
              alerts,
            ]
          properties:
            reportable_animal_count: { type: integer, minimum: 0 }
            today_report_count: { type: integer, minimum: 0 }
            active_draft_count: { type: integer, minimum: 0 }
            pending_ai_count: { type: integer, minimum: 0 }
            alerts: { type: array, items: { type: string } }
        recent_reports:
          type: array
          items: { $ref: "#/components/schemas/ManagementReport" }
    ManagementAnimal:
      type: object
      required: [id, name, shelter_number, status, area]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shelter_number: { type: string }
        status: { type: string }
        current_photo_key: { type: [string, "null"] }
        area: { type: [string, "null"] }
    ManagementAnimalListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ManagementAnimal" },
          }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    AnimalStatusUpdateRequest:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, minLength: 1, maxLength: 30 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    AnimalStatusUpdateResponse:
      type: object
      required: [animal, suspended_series_count]
      properties:
        animal: { $ref: "#/components/schemas/ManagementAnimal" }
        suspended_series_count: { type: integer, minimum: 0 }
    ManagementReport:
      type: object
      required:
        [
          id,
          animal_id,
          status,
          submitted_at,
          answers,
          corrections,
          ai_observations,
        ]
      properties:
        id: { type: string, format: uuid }
        animal_id: { type: string, format: uuid }
        animal_name: { type: [string, "null"] }
        status: { type: string }
        submitted_at: { type: string, format: date-time }
        answers: { type: object, additionalProperties: true }
        note: { type: [string, "null"] }
        media_ids: { type: array, items: { type: string, format: uuid } }
        corrections:
          { type: array, items: { type: object, additionalProperties: true } }
        ai_observations:
          { type: array, items: { $ref: "#/components/schemas/AiObservation" } }
    ManagementReportListResponse:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ManagementReport" },
          }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    ManagementReportCorrectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        observations: { type: object, additionalProperties: true }
        note: { type: [string, "null"] }
        animal_id: { type: [string, "null"], format: uuid }
    ManagementArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ManagementReportableScope:
      type: object
      required: [id, organization_id, starts_at, ends_at, status]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        animal_id: { type: [string, "null"], format: uuid }
        area_id: { type: [string, "null"], format: uuid }
        volunteer_user_id: { type: [string, "null"], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [active, inactive] }
    ManagementReportableScopeList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ManagementReportableScope" },
          }
    ManagementReportableScopeRequest:
      type: object
      required: [starts_at, ends_at]
      properties:
        animal_id: { type: [string, "null"], format: uuid }
        area_id: { type: [string, "null"], format: uuid }
        volunteer_user_id: { type: [string, "null"], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    ManagementReportableScopeUpdateRequest:
      type: object
      properties:
        status: { type: string, enum: [active, inactive] }
        ends_at: { type: string, format: date-time }
    ManagementQrCode:
      type: object
      required: [id, animal_id, status, deep_link]
      properties:
        id: { type: string, format: uuid }
        animal_id: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        deep_link: { type: string }
        token: { type: [string, "null"], description: 僅建立時回傳 }
    ManagementQrCodeList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ManagementQrCode" },
          }
    ManagementQrCodeRequest:
      type: object
      required: [animal_id]
      properties:
        animal_id: { type: string, format: uuid }
    ManagementAuditRecord:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: [string, "null"], format: uuid }
        actor_user_id: { type: [string, "null"], format: uuid }
        operation_id: { type: string, format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, "null"], format: uuid }
        source_channel: { type: string }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        reason: { type: [string, "null"] }
        result: { type: string, enum: [success] }
        created_at: { type: string, format: date-time }
    ManagementAuditList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: "#/components/schemas/ManagementAuditRecord" },
          }
    LineWebhookRequest:
      type: object
      required: [destination, events]
      properties:
        destination: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/LineWebhookEvent"
    LineWebhookEvent:
      type: object
      required: [type, webhookEventId, timestamp, source]
      properties:
        type:
          {
            type: string,
            enum:
              [
                message,
                postback,
                follow,
                unfollow,
                beacon,
                join,
                memberJoined,
                memberLeft,
                accountLink,
                things,
              ],
          }
        webhookEventId: { type: string, minLength: 1 }
        timestamp: { type: integer, format: int64 }
        source: { type: object, additionalProperties: true }
        deliveryContext:
          type: object
          properties:
            isRedelivery: { type: boolean }
        message: { type: object, additionalProperties: true }
        postback: { type: object, additionalProperties: true }
    LineWebhookResponse:
      type: object
      required: [accepted, event_results]
      properties:
        accepted: { type: boolean }
        event_results:
          type: array
          items:
            type: object
            required: [webhook_event_id, status]
            properties:
              webhook_event_id: { type: string }
              status:
                {
                  type: string,
                  enum:
                    [
                      processed,
                      duplicate_ignored,
                      signature_rejected,
                      requires_liff,
                      rejected,
                      failed,
                    ],
                }
              reason: { type: [string, "null"] }
              webhook_session: { $ref: "#/components/schemas/WebhookSession" }
              next_action:
                {
                  type: [string, "null"],
                  enum:
                    [
                      resume_report,
                      bind_line_identity,
                      select_shelter_in_liff,
                      null,
                    ],
                }
    LineBindRequest:
      type: object
      required: [id_token]
      properties:
        id_token: { type: string }
    LineBindResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/AuthResponse" }
    RichMenuContext:
      type: object
      required: [context_status, actions]
      properties:
        context_status:
          {
            type: string,
            enum:
              [single_context, multiple_contexts, no_context, requires_liff],
          }
        organization_id: { type: [string, "null"], format: uuid }
        webhook_session_id: { type: [string, "null"], format: uuid }
        actions:
          type: array
          items:
            type: object
            required: [code, display_name]
            properties:
              code: { type: string }
              display_name: { type: string }
              action_type:
                {
                  type: string,
                  enum: [postback, uri, camera, camera_roll, message],
                }
    CurrentLineDraftResponse:
      type: object
      required: [draft]
      properties:
        draft:
          anyOf:
            - $ref: "#/components/schemas/Draft"
            - type: "null"
    ResumeDraftRequest:
      type: object
      properties:
        draft_token: { type: string, minLength: 1 }
    CancelDraftRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    LiffExchangeRequest:
      type: object
      additionalProperties: false
      required: [id_token, shelter_entry_reference]
      properties:
        id_token: { type: string, minLength: 1, maxLength: 8192 }
        shelter_entry_reference: { type: string, minLength: 32, maxLength: 512 }
    LiffExchangeResponse:
      oneOf:
        - { $ref: "#/components/schemas/LiffExchangeNewResponse" }
        - { $ref: "#/components/schemas/LiffExchangePendingResponse" }
        - { $ref: "#/components/schemas/LiffExchangeActiveResponse" }
        - { $ref: "#/components/schemas/LiffExchangeSuspendedResponse" }
      discriminator:
        propertyName: state
        mapping:
          NEW: "#/components/schemas/LiffExchangeNewResponse"
          PENDING: "#/components/schemas/LiffExchangePendingResponse"
          ACTIVE: "#/components/schemas/LiffExchangeActiveResponse"
          SUSPENDED: "#/components/schemas/LiffExchangeSuspendedResponse"
    LiffExchangeOrganization:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
    LiffExchangeVolunteerUser:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, const: VOLUNTEER }
    LiffExchangeNewResponse:
      type: object
      additionalProperties: false
      required: [state, organization, next_path]
      properties:
        state: { type: string, const: NEW }
        organization: { $ref: "#/components/schemas/LiffExchangeOrganization" }
        next_path: { type: string, const: "/volunteer-application" }
    LiffExchangePendingResponse:
      type: object
      additionalProperties: false
      required: [state, organization]
      properties:
        state: { type: string, const: PENDING }
        organization: { $ref: "#/components/schemas/LiffExchangeOrganization" }
    LiffExchangeActiveResponse:
      type: object
      additionalProperties: false
      required:
        [state, access_token, refresh_token, expires_in, session_id, user_id, user, organization, next_path]
      properties:
        state: { type: string, const: ACTIVE }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 900 }
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/LiffExchangeVolunteerUser" }
        organization: { $ref: "#/components/schemas/LiffExchangeOrganization" }
        next_path: { type: string, const: "/animal-confirmation" }
    LiffExchangeSuspendedResponse:
      type: object
      additionalProperties: false
      required: [state, organization]
      properties:
        state: { type: string, const: SUSPENDED }
        organization: { $ref: "#/components/schemas/LiffExchangeOrganization" }
    AuthResponse:
      type: object
      required: [access_token, expires_in, session_id, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer, example: 900 }
        session_id: { type: string, format: uuid }
        organizations:
