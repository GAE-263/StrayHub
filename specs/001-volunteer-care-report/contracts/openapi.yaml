        - required: [shelter_entry_reference]
          properties:
            organization_id:
              type: 'null'
            shelter_entry_reference:
              type: string
              minLength: 32
              maxLength: 512
              pattern: '^[A-Za-z0-9._~-]+$'
    VolunteerApplicationCreateRequest:
      type: object
      required: [id_token, applicant_name, phone_number, client_request_id, consent_acknowledged, service_dates]
      additionalProperties: false
      properties:
        id_token:
          type: string
          minLength: 1
        organization_id:
          type: [string, 'null']
          format: uuid
        shelter_entry_reference:
          type: [string, 'null']
          minLength: 32
          maxLength: 512
          pattern: '^[A-Za-z0-9._~-]+$'
