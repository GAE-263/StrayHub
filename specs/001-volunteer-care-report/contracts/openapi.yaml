        service_area: { type: string }
        contact: { type: string }
    InitialAdminCreateRequest:
      type: object
      required: [username, temporary_password]
      properties:
        username: { type: string }
        temporary_password: { type: string, format: password }
    OrganizationUpdateRequest:
      type: object
      properties:
