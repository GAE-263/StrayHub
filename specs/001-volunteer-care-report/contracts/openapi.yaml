    CareReportAnswers:
      allOf:
        - $ref: "#/components/schemas/DraftAnswers"
        - type: object
          required:
            [
              care_completion,
              walk_completion,
              feeding,
              water,
              activity,
              urination,
              defecation,
              resource_guarding,
              human_interaction,
              animal_interaction,
              emotion,
              walk_reaction,
              appearance_special_status,
            ]
      description: 正式 Care Report 必須完整包含的標準結構化答案；照片與心得不在此必要集合
    DraftUpdateRequest:
      type: object
      properties:
        answers:
          $ref: "#/components/schemas/DraftAnswers"
          description: 可只包含目前新增或修改的答案；後端依 Draft 目前狀態驗證，不接受跳步或略過必要題目
        note: { type: string }
        media_ids: { type: array, items: { type: string, format: uuid } }
    Draft:
      type: object
      required:
        [
          id,
          opaque_token,
          organization_id,
          animal_id,
          volunteer_user_id,
          membership_id,
          current_step,
          answers,
          status,
          expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        opaque_token: { type: [string, "null"], minLength: 1 }
        organization_id: { type: string, format: uuid }
        animal_id: { type: string, format: uuid }
        volunteer_user_id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        current_step:
          {
            type: string,
            enum:
              [
                selecting_animal,
                confirming_animal,
                answering_completion,
                answering_feeding,
                answering_water,
                answering_activity,
                answering_elimination,
                answering_behavior,
                answering_special_status,
                awaiting_media,
                awaiting_note,
                reviewing,
                submitting,
                submitted,
                cancelled,
                expired,
              ],
          }
        answers:
          $ref: "#/components/schemas/DraftAnswers"
        media_ids: { type: array, items: { type: string, format: uuid } }
        last_interaction_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, submitted, cancelled, expired] }
