openapi: 3.1.0
info:
  title: StrayHub CRM Care Report API
  version: 0.1.0
  description: >-
    志工日常照護回報與動物近期歷程的 CRM 邊界契約。一般收容所操作由
    FastAPI 重新驗證 Session、Membership、角色與 Active Shelter Context；
    PLATFORM_ADMIN 使用平台級 PLATFORM Scope，且所有跨收容所操作都留下 Audit Record。
servers:
  - url: http://localhost:8000
    description: 本機開發
tags:
  - name: Authentication
  - name: Organizations
  - name: Memberships
  - name: Animal Selection
  - name: Drafts
  - name: Media
  - name: Care Reports
  - name: Timeline
  - name: Observation Vocabulary
  - name: AI
  - name: LINE Bot
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': { description: Session 已撤銷 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      responses:
        '200':
          description: 目前使用者與 Membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/liff/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeLiffIdentity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiffExchangeRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/auth/active-shelter-context:
    get:
      tags: [Authentication]
      operationId: getActiveShelterContext
      responses:
        '200':
          description: 目前 Session 的 Active Shelter Context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveShelterContext' }
    put:
      tags: [Authentication]
      operationId: switchActiveShelterContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelterContextSwitchRequest' }
      responses:
        '200':
          description: 切換後的 Active Shelter Context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveShelterContext' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      responses:
        '200':
          description: 依角色可見的收容所
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationListResponse' }
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreateRequest' }
      responses:
        '201':
          description: 收容所已建立，預設未啟用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        '200':
          description: 收容所資料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdateRequest' }
      responses:
        '200':
          description: 收容所已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationId}/disable:
    post:
      tags: [Organizations]
      operationId: disableOrganization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '204': { description: 收容所已停用 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationId}/initial-admin:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organizations]
      operationId: createInitialShelterAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitialAdminCreateRequest' }
      responses:
        '201':
          description: 初始收容所管理員帳號已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Memberships]
      operationId: listMemberships
      responses:
        '200':
          description: 收容所 Membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipListResponse' }
    post:
      tags: [Memberships]
      operationId: createMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipCreateRequest' }
      responses:
        '201':
          description: Membership 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [Memberships]
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipUpdateRequest' }
      responses:
        '200':
          description: Membership 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/animals:
    get:
      tags: [Animal Selection]
      operationId: listReportableAnimals
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 目前 Active Shelter Context 內的授權 Animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalListResponse' }
  /v1/animals/search:
    get:
      tags: [Animal Selection]
      operationId: searchAnimalsByShelterNumber
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 授權範圍內的候選 Animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalListResponse' }
  /v1/qr-tokens/resolve:
    post:
      tags: [Animal Selection]
      operationId: resolveQrToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QrResolveRequest' }
      responses:
        '200':
          description: 唯一候選 Animal 確認卡資料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalCandidate' }
        '404': { $ref: '#/components/responses/NotFoundOrForbidden' }
  /v1/animals/{animalId}/confirm:
    post:
      tags: [Animal Selection]
      operationId: confirmAnimal
      parameters:
        - $ref: '#/components/parameters/AnimalId'
      responses:
        '200':
          description: 已確認的 Animal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnimalCandidate' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/care-report-drafts:
    post:
      tags: [Drafts]
      operationId: createCareReportDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftCreateRequest' }
      responses:
        '201':
          description: Draft 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
    get:
      tags: [Drafts]
      operationId: listCareReportDrafts
      responses:
        '200':
          description: 本人可見 Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftListResponse' }
  /v1/care-report-drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [Drafts]
      operationId: getCareReportDraft
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
    patch:
      tags: [Drafts]
      operationId: updateCareReportDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdateRequest' }
      responses:
        '200':
          description: Draft 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
    delete:
      tags: [Drafts]
      operationId: deleteCareReportDraft
      responses:
        '204': { description: Draft 已刪除或進入清理流程 }
  /v1/media:
    post:
      tags: [Media]
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [draft_id, purpose, file]
              properties:
                draft_id: { type: string, format: uuid }
                purpose: { type: string, enum: [elimination, fur, appearance, activity, other] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Media 處理狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
  /v1/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/MediaId'
    get:
      tags: [Media]
      operationId: getMediaStatus
      responses:
        '200':
          description: Media 狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
    delete:
      tags: [Media]
      operationId: deleteTemporaryMedia
      responses:
        '204': { description: 尚未提交的 Temporary Media 已刪除 }
  /v1/media/{mediaId}/download-url:
    post:
      tags: [Media]
      operationId: createSignedDownloadUrl
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 短效 Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrlResponse' }
  /v1/care-reports:
    post:
      tags: [Care Reports]
      operationId: createCareReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareReportCreateRequest' }
      responses:
        '201':
          description: 原始 Care Report 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareReport' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/care-reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Care Reports]
      operationId: getCareReport
      responses:
        '200':
          description: Care Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareReport' }
    patch:
      tags: [Care Reports]
      operationId: correctCareReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CareReportCorrectionRequest' }
      responses:
        '200':
          description: Care Report 已修正或封存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareReport' }
  /v1/care-reports/{reportId}/archive:
    post:
      tags: [Care Reports]
      operationId: archiveCareReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '204': { description: Care Report 已封存並留下 Audit Record }
  /v1/animals/{animalId}/timeline:
    get:
      tags: [Timeline]
      operationId: getAnimalTimeline
      parameters:
        - $ref: '#/components/parameters/AnimalId'
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 每日摘要與逐筆 Timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineResponse' }
  /v1/observation-categories:
    get:
      tags: [Observation Vocabulary]
      operationId: listObservationCategories
      responses:
        '200':
          description: 觀察類別
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationCategoryListResponse' }
  /v1/observation-options:
    get:
      tags: [Observation Vocabulary]
      operationId: listObservationOptions
      responses:
        '200':
          description: 目前可用與歷史 Observation Option
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationOptionListResponse' }
    post:
      tags: [Observation Vocabulary]
      operationId: createObservationOption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationOptionCreateRequest' }
      responses:
        '201':
          description: Observation Option 已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationOption' }
  /v1/observation-options/{optionId}:
    parameters:
      - $ref: '#/components/parameters/OptionId'
    patch:
      tags: [Observation Vocabulary]
      operationId: updateObservationOption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationOptionUpdateRequest' }
      responses:
        '200':
          description: Observation Option 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationOption' }
  /v1/care-reports/{reportId}/ai-observations:
    get:
      tags: [AI]
      operationId: listAiObservations
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: AI Observation 與處理狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiObservationListResponse' }
  /v1/ai-observations/{observationId}/review:
    post:
      tags: [AI]
      operationId: reviewAiObservation
      parameters:
        - $ref: '#/components/parameters/ObservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReviewRequest' }
      responses:
        '200':
          description: AI Observation 已確認、拒絕或修正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiObservation' }

  /v1/line/webhook:
    post:
      tags: [LINE Bot]
      operationId: receiveLineWebhook
      security: []
      description: >-
        LINE Messaging API Webhook 邊界。伺服器必須先以未修改的原始 Request Body
        與 X-Line-Signature 驗證簽章，再解析事件；事件依 webhookEventId 冪等處理。
        Webhook 本身不代表 CRM 使用者已取得回報權限；系統必須依 LINE Binding、唯一
        Webhook Session 或唯一 Shelter Context 重新判定是否可以開始回報，多個候選不得自動選擇。
      parameters:
        - $ref: '#/components/parameters/LineSignature'
      requestBody:
        required: true
        description: 必須保留未修改的原始 Request Body，並在 JSON 解析前搭配 X-Line-Signature 完成驗證。
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineWebhookRequest' }
      responses:
        '200':
          description: 已接受、已忽略重送或已安全處理事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineWebhookResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/line/bind:
    post:
      tags: [LINE Bot]
      operationId: bindLineIdentity
      security: []
      description: FastAPI 驗證 LINE 身分後，將其對應既有 User 與有效 Membership；不得自動建立正式 Membership。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineBindRequest' }
      responses:
        '200':
          description: 已建立本系統 Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineBindResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/line/rich-menu/context:
    get:
      tags: [LINE Bot]
      operationId: getLineRichMenuContext
      responses:
        '200':
          description: 目前 Active Shelter Context 可用的 Rich Menu Action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RichMenuContext' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/line/care-report/drafts/current:
    get:
      tags: [LINE Bot]
      operationId: getCurrentLineCareReportDraft
      responses:
        '200':
          description: 目前 Organization 的 active Draft；不存在時回傳空值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentLineDraftResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/line/care-report/drafts/{draftId}/resume:
    post:
      tags: [LINE Bot]
      operationId: resumeLineCareReportDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeDraftRequest' }
      responses:
        '200':
          description: Draft 已恢復至其目前合法步驟
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/line/care-report/drafts/{draftId}/cancel:
    post:
      tags: [LINE Bot]
      operationId: cancelLineCareReportDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelDraftRequest' }
      responses:
        '200':
          description: Draft 已取消且不會建立正式回報
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AccessToken
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    MembershipId: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    AnimalId: { name: animalId, in: path, required: true, schema: { type: string, format: uuid } }
    DraftId: { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    OptionId: { name: optionId, in: path, required: true, schema: { type: string, format: uuid } }
    ObservationId: { name: observationId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
    LineSignature: { name: X-Line-Signature, in: header, required: true, schema: { type: string, minLength: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    BadRequest:
      description: Webhook 或 Request 格式錯誤
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    AuthResponse:
      description: 本系統 Session 憑證
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    Unauthorized:
      description: 未通過身分驗證
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: 無權限或無法存取，不能洩漏資源存在性
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFoundOrForbidden:
      description: 不存在或未授權的一致結果
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Idempotency 或資料狀態衝突
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    LineWebhookRequest:
      type: object
      required: [destination, events]
      properties:
        destination: { type: string }
        events:
          type: array
          items:
            $ref: '#/components/schemas/LineWebhookEvent'
    LineWebhookEvent:
      type: object
      required: [type, webhookEventId, timestamp, source]
      properties:
        type: { type: string, enum: [message, postback, follow, unfollow, beacon, join, memberJoined, memberLeft, accountLink, things] }
        webhookEventId: { type: string, minLength: 1 }
        timestamp: { type: integer, format: int64 }
        source: { type: object, additionalProperties: true }
        deliveryContext:
          type: object
          properties:
            isRedelivery: { type: boolean }
        message: { type: object, additionalProperties: true }
        postback: { type: object, additionalProperties: true }
    LineWebhookResponse:
      type: object
      required: [accepted, event_results]
      properties:
        accepted: { type: boolean }
        event_results:
          type: array
