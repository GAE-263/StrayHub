        parent_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [active, inactive] }
    ShelterAreaListResponse:
      type: object
      required: [items]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/ShelterArea" } }
    AnimalCandidate:
      type: object
