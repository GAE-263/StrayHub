          $ref: "#/components/schemas/CareReportAnswers"
          description: 標準回報完整結構化答案；照片與心得不屬於必要欄位
        note: { type: string }
        media_ids: { type: array, items: { type: string, format: uuid } }
    CareReportCorrectionRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        observations: { type: object, additionalProperties: true }
        note: { type: string }
        animal_id: { type: string, format: uuid }
    ArchiveRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    CareReport:
      type: object
      required:
        [id, organization_id, animal_id, status, observations, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        animal_id: { type: string, format: uuid }
        status: { type: string, enum: [saved, amended, archived] }
        observations:
          $ref: "#/components/schemas/CareReportAnswers"
