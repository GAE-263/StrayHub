      required: [id, organization_id, status, exif_removed]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                temporary,
                processing,
                processed,
                attached,
                failed,
                unusable,
                archived,
              ],
          }
        exif_removed: { type: boolean, const: true }
        checksum: { type: string }
        purpose: { type: string }
    SignedUrlResponse:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
