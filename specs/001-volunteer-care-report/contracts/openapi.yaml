openapi: 3.1.0
info:
  title: StrayHub CRM Care Report API
  version: 0.1.0
  description: >-
    志工日常照護回報與動物近期歷程的 CRM 邊界契約。一般收容所操作由
    FastAPI 重新驗證 Session、Membership、角色與 Active Shelter Context；
    PLATFORM_ADMIN 使用平台級 PLATFORM Scope，且所有跨收容所操作都留下 Audit Record。
x-contract-types:
  generator: openapi-typescript
  output: packages/contracts/src/openapi.ts
  source-of-truth: specs/001-volunteer-care-report/contracts/openapi.yaml
  generated-file-editable: false
servers:
  - url: http://localhost:8000
    description: 本機開發
tags:
  - name: Authentication
  - name: Organizations
  - name: Memberships
  - name: Animal Selection
  - name: Drafts
  - name: Media
  - name: Care Reports
  - name: Timeline
  - name: Observation Vocabulary
  - name: AI
  - name: Management Workbench
  - name: Management Animals
  - name: Management Reports
  - name: Management Settings
  - name: Management Audit
  - name: LINE Bot
  - name: Volunteer Applications
  - name: Volunteer Access Management
  - name: Volunteer Notification Management
  - name: Platform Administrators
security:
  - bearerAuth: []
paths:
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        "204": { description: Session 已撤銷 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      responses:
        "200":
          description: 目前使用者與 Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/liff/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeLiffIdentity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiffExchangeRequest" }
      responses:
        "200":
          description: LIFF 身分與志工 onboarding／授權狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiffExchangeResponse" }
        "401": { $ref: "#/components/responses/LiffIdentityRejected" }
        "403": { $ref: "#/components/responses/LiffEntryUnavailable" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/auth/active-shelter-context:
    get:
      tags: [Authentication]
      operationId: getActiveShelterContext
      responses:
        "200":
          description: 目前 Session 的 Active Shelter Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveShelterContext" }
    put:
      tags: [Authentication]
      operationId: switchActiveShelterContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelterContextSwitchRequest" }
      responses:
        "200":
          description: 切換後的 Active Shelter Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveShelterContext" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      responses:
        "200":
          description: 依角色可見的收容所
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationListResponse" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreateRequest" }
      responses:
        "201":
          description: 收容所已建立，預設未啟用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        "200":
          description: 收容所資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { $ref: "#/components/responses/NotFoundOrForbidden" }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdateRequest" }
      responses:
        "200":
          description: 收容所已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/disable:
    post:
      tags: [Organizations]
      operationId: disableOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "204": { description: 收容所已停用 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/initial-admin:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Organizations]
      operationId: createInitialShelterAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InitialAdminCreateRequest" }
      responses:
        "201":
          description: 初始收容所管理員帳號已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/memberships:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Memberships]
      operationId: listMemberships
      responses:
        "200":
          description: 收容所 Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipListResponse" }
    post:
      tags: [Memberships]
      operationId: createMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipCreateRequest" }
      responses:
        "201":
          description: Membership 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/accounts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Memberships]
      operationId: createOrganizationAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "201":
          description: 收容所帳號與 Membership 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/memberships/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    patch:
      tags: [Memberships]
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipUpdateRequest" }
      responses:
        "200":
          description: Membership 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/organizations/{organizationId}/memberships/archived:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Memberships]
      operationId: listArchivedMemberships
      responses:
        "200":
          description: 收容所已封存 Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/memberships/{membershipId}/archive:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    post:
      tags: [Memberships]
      operationId: archiveMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipMutationVersionRequest" }
      responses:
        "200":
          description: Membership 已封存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/organizations/{organizationId}/memberships/{membershipId}/restore:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/MembershipId"
    post:
      tags: [Memberships]
      operationId: restoreMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipMutationVersionRequest" }
      responses:
        "200":
          description: Membership 已恢復
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/organizations/{organizationId}/areas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: listShelterAreas
      responses:
        "200":
          description: 收容所 Cage/Area 清單
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelterAreaListResponse" }
    post:
      tags: [Organizations]
      operationId: createShelterArea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelterAreaCreateRequest" }
      responses:
        "201":
          description: Cage/Area 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelterArea" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/organizations/{organizationId}/areas/{areaId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: areaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Organizations]
      operationId: updateShelterArea
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShelterAreaUpdateRequest" }
      responses:
        "200":
          description: Cage/Area 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShelterArea" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/animals:
    get:
      tags: [Animal Selection]
      operationId: listReportableAnimals
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 目前 Active Shelter Context 內的授權 Animal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimalListResponse" }
  /v1/animals/search:
    get:
      tags: [Animal Selection]
      operationId: searchAnimalsByShelterNumber
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 授權範圍內的候選 Animal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimalListResponse" }
  /v1/qr-tokens/resolve:
    post:
      tags: [Animal Selection]
      operationId: resolveQrToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrResolveRequest" }
      responses:
        "200":
          description: 唯一候選 Animal 確認卡資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimalCandidate" }
        "404": { $ref: "#/components/responses/NotFoundOrForbidden" }
  /v1/animals/{animalId}/confirm:
    post:
      tags: [Animal Selection]
      operationId: confirmAnimal
      parameters:
        - $ref: "#/components/parameters/AnimalId"
      responses:
        "200":
          description: 已確認的 Animal
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AnimalConfirmationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/care-report-drafts:
    post:
      tags: [Drafts]
      operationId: createCareReportDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftCreateRequest" }
      responses:
        "201":
          description: Draft 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
    get:
      tags: [Drafts]
      operationId: listCareReportDrafts
      responses:
        "200":
          description: 本人可見 Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftListResponse" }
  /v1/care-report-drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      tags: [Drafts]
      operationId: getCareReportDraft
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
    patch:
      tags: [Drafts]
      operationId: updateCareReportDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdateRequest" }
      responses:
        "200":
          description: Draft 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
    delete:
      tags: [Drafts]
      operationId: deleteCareReportDraft
      responses:
        "204": { description: Draft 已刪除或進入清理流程 }
  /v1/media:
    post:
      tags: [Media]
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [draft_id, purpose, file]
              properties:
                draft_id: { type: string, format: uuid }
                purpose:
                  {
                    type: string,
                    enum: [elimination, fur, appearance, activity, other],
                  }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Media 處理狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /v1/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      tags: [Media]
      operationId: getMediaStatus
      responses:
        "200":
          description: Media 狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
    delete:
      tags: [Media]
      operationId: deleteTemporaryMedia
      responses:
        "204": { description: 尚未提交的 Temporary Media 已刪除 }
  /v1/media/{mediaId}/download-url:
    post:
      tags: [Media]
      operationId: createSignedDownloadUrl
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: 短效 Signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrlResponse" }
  /v1/care-reports:
    post:
      tags: [Care Reports]
      operationId: createCareReport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareReportCreateRequest" }
      responses:
        "201":
          description: 原始 Care Report 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareReport" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/care-reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Care Reports]
      operationId: getCareReport
      responses:
        "200":
          description: Care Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareReport" }
    patch:
      tags: [Care Reports]
      operationId: correctCareReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CareReportCorrectionRequest" }
      responses:
        "200":
          description: Care Report 已修正或封存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareReport" }
  /v1/care-reports/{reportId}/archive:
    post:
      tags: [Care Reports]
      operationId: archiveCareReport
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveRequest" }
      responses:
        "204": { description: Care Report 已封存並留下 Audit Record }
  /v1/animals/{animalId}/timeline:
    get:
      tags: [Timeline]
      operationId: getAnimalTimeline
      parameters:
        - $ref: "#/components/parameters/AnimalId"
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 每日摘要與逐筆 Timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelineResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /v1/observation-categories:
    get:
      tags: [Observation Vocabulary]
      operationId: listObservationCategories
      responses:
        "200":
          description: 觀察類別
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ObservationCategoryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/observation-options:
    get:
      tags: [Observation Vocabulary]
      operationId: listObservationOptions
      summary: 取得目前收容所的觀察選項與摘要
      description: >-
        設定管理者可讀取啟用、停用與封存的完整管理資料；Staff 只回傳啟用中的可用詞彙。
        回應只包含平台預設與目前收容所自訂資料，搜尋與篩選條件可同時使用。
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [active, disabled, archived] }
        - name: source
          in: query
          required: false
          schema: { type: string, enum: [platform_default, organization_extension] }
      responses:
        "200":
          description: 選項、類別計數與未篩選摘要
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ObservationOptionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Observation Vocabulary]
      operationId: createObservationOption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ObservationOptionCreateRequest" }
      responses:
        "201":
          description: Observation Option 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /v1/observation-options/{optionId}:
    parameters:
      - $ref: "#/components/parameters/OptionId"
    patch:
      tags: [Observation Vocabulary]
      operationId: updateObservationOption
      summary: 修改收容所自訂觀察選項
      description: >-
        可修改中文名稱、說明、排序、是否需要補充說明；stable code 只有在沒有歷史使用時可修改。
        平台預設與其他收容所 option 一律不可修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ObservationOptionUpdateRequest" }
      responses:
        "200":
          description: Observation Option 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /v1/observation-options/{optionId}/disable:
    parameters:
      - $ref: "#/components/parameters/OptionId"
    post:
      tags: [Observation Vocabulary]
      operationId: disableObservationOption
      summary: 停用收容所自訂觀察選項
      description: 停用不會出現在新的回報表單，歷史回報與快照仍保留。
      responses:
        "200":
          description: 選項已變為 disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservationOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFoundOrForbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/observation-options/{optionId}/restore:
    parameters:
      - $ref: "#/components/parameters/OptionId"
    post:
      tags: [Observation Vocabulary]
      operationId: restoreObservationOption
      summary: 恢復收容所自訂觀察選項
