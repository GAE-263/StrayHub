      type: string
      enum:
        [
          care_completion.completed,
          care_completion.partially_completed,
          care_completion.not_provided,
          care_completion.not_observed,
          care_completion.uncertain,
        ]
      description: 照護完成狀態；未觀察與無法判斷不得解讀為已完成
    WalkCompletionCode:
      type: string
      enum:
        [
          walk_completion.completed,
          walk_completion.partially_completed,
          walk_completion.not_done,
          walk_completion.not_observed,
          walk_completion.uncertain,
        ]
      description: 散步完成狀態；與散步反應的 walk.* 選項分開
    ObservationAnswerCode:
      type: string
      minLength: 1
      description: 由 CRM 有效 Observation Vocabulary 提供的穩定 Code；顯示名稱不得作為正式值
    DraftAnswers:
      type: object
      additionalProperties: true
      properties:
        care_completion: { $ref: "#/components/schemas/CareCompletionCode" }
        walk_completion: { $ref: "#/components/schemas/WalkCompletionCode" }
        feeding: { $ref: "#/components/schemas/ObservationAnswerCode" }
        water: { $ref: "#/components/schemas/ObservationAnswerCode" }
        activity: { $ref: "#/components/schemas/ObservationAnswerCode" }
        urination: { $ref: "#/components/schemas/ObservationAnswerCode" }
        defecation: { $ref: "#/components/schemas/ObservationAnswerCode" }
        resource_guarding:
          { $ref: "#/components/schemas/ObservationAnswerCode" }
        human_interaction:
          { $ref: "#/components/schemas/ObservationAnswerCode" }
        animal_interaction:
          { $ref: "#/components/schemas/ObservationAnswerCode" }
        emotion: { $ref: "#/components/schemas/ObservationAnswerCode" }
        walk_reaction: { $ref: "#/components/schemas/ObservationAnswerCode" }
        appearance_special_status:
          { $ref: "#/components/schemas/ObservationAnswerCode" }
