        display_name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 500 }
        status: { type: string, enum: [active, disabled] }
        display_order: { type: integer, minimum: 0 }
        source:
          { type: string, enum: [platform_default, organization_extension] }
    ObservationOption:
      type: object
      required:
        [
          id,
          category_id,
          code,
          display_name,
          description,
          status,
          enabled,
          display_order,
          requires_note,
          source,
          editable,
          has_historical_usage,
          historical_usage_count,
          last_modified_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
