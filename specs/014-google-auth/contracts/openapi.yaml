      - name
      - role
      title: AccountOrganizationResponse
    AccountResponse:
      properties:
        user:
          $ref: '#/components/schemas/AccountUserResponse'
        state:
          type: string
          enum:
          - account_only
          - ready
          title: State
        organizations:
          items:
            $ref: '#/components/schemas/AccountOrganizationResponse'
          type: array
          title: Organizations
        login_methods:
          $ref: '#/components/schemas/AccountLoginMethods'
      type: object
      required:
      - user
      - state
      - organizations
      - login_methods
      title: AccountResponse
    AccountUserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        display_name:
          type: string
          title: Display Name
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        platform_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform Role
      type: object
      required:
      - id
      - display_name
      - username
      - platform_role
      title: AccountUserResponse
    ApplicationResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
