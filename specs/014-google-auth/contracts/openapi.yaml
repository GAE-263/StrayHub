          type: string
          format: uuid
          title: Organization Id
        organization_name:
          type: string
          title: Organization Name
        user_id:
          type: string
          format: uuid
          title: User Id
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          title: Status
        role:
          anyOf:
          - type: string
            enum:
