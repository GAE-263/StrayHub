openapi: 3.1.0
info:
  title: StrayHub 004 LIFF Exchange Additive Contract
  version: 0.1.0
  description: |
    LIFF identity、收容所 entry context 與志工 onboarding／authorization state 的
    additive contract。實作時合併至
    specs/001-volunteer-care-report/contracts/openapi.yaml。
servers:
  - url: /
tags:
  - name: Authentication
paths:
  /v1/auth/liff/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeLiffIdentity
      summary: 以 LINE identity 與收容所專屬 entry 原子建立 Session／Active Shelter Context
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiffExchangeRequest'
      responses:
        '200':
          description: |
            LINE token 與 entry reference 均已驗證，回傳 NEW、PENDING、ACTIVE 或
            SUSPENDED。只有 ACTIVE 包含 internal Session／Refresh Token；其他 state
            禁止包含任何 session credential。
          content:
            application/json:
              schema:
                $ref: '../../001-volunteer-care-report/contracts/openapi.yaml#/components/schemas/LiffExchangeResponse'
        '401':
          description: LINE id token 無效、過期或audience不符
          content:
            application/json:
              schema:
                $ref: '../../001-volunteer-care-report/contracts/openapi.yaml#/components/schemas/LiffIdentityError'
        '403':
          description: |
            entry無效、撤銷、過期、purpose不符，或無法安全解析organization。
            Response不得揭露其他收容所、其他使用者、動物、草稿或內部count；失敗
            不得留下Session、Refresh Token或Active Shelter Context。
          content:
            application/json:
              schema:
                $ref: '../../001-volunteer-care-report/contracts/openapi.yaml#/components/schemas/LiffEntryUnavailableError'
        '422':
          description: Request schema 無效
          content:
            application/json:
              schema:
                $ref: '../../001-volunteer-care-report/contracts/openapi.yaml#/components/schemas/ErrorResponse'
        '503':
          description: LINE provider／verifier、entry resolver、database 或 authentication 設定暫時不可用或無法驗證
          content:
            application/json:
              schema:
                $ref: '../../001-volunteer-care-report/contracts/openapi.yaml#/components/schemas/ErrorResponse'
      x-transaction-invariants:
        - entry reference 只解析候選 organization，不授權
        - server 只檢查候選 organization 的 exact VOLUNTEER Membership/Grant
        - NEW、PENDING、SUSPENDED 不得建立或回傳 internal Session credential
        - SessionRecord.active_organization_id 必須在 Session 建立時一次寫入
        - 任一失敗時新增 SessionRecord、RefreshTokenRecord 與 Active Context 數量皆為 0
components:
  schemas:
    LiffExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - id_token
        - shelter_entry_reference
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: LIFF SDK getIDToken() 取得的 raw ID token；不得傳 decoded profile。
        shelter_entry_reference:
          type: string
          minLength: 32
          maxLength: 512
          description: 收容所專屬 opaque entry reference；只解析候選 organization，不是授權憑證。
